blueprint:
  name: CamperMinder Level - Frostwarnung
  description: >-
    Meldet, wenn es im Fahrzeug kalt wird — bevor die Wasserleitung platzt.


    **Eine Einschränkung, die man kennen muss:** Das Gerät misst die
    Temperatur **seines eigenen Lagesensors**, nicht die der Raumluft. Der
    Sensor erwärmt sich selbst und sitzt dort, wo das Gehäuse klebt. Für eine
    Frostwarnung reicht das, sobald der Abgleich (Geräteseite unter *Gerät →
    Temperatur Abgleich*, in Home Assistant unter *Konfiguration*) einmal
    gegen ein Thermometer gesetzt wurde. Für eine Klimaregelung reicht es
    nicht.


    Der Grenzwert steht im Gerät (*Frostwarnung unter*, Vorgabe 3 °C) und gilt
    auch ohne Home Assistant — diese Automatisierung bringt die Meldung nur
    dorthin, wo du sie liest. Das Gerät nimmt die Warnung erst zwei Grad über
    dem Grenzwert zurück; eine Temperatur, die um den Grenzwert pendelt, löst
    deshalb nicht die ganze Nacht neue Meldungen aus.
  domain: automation
  source_url: https://github.com/rcdev67/camperminder/blob/main/blueprints/automation/camperminder/frostwarnung.yaml
  input:
    frost:
      name: Frostgefahr
      description: Der Melder des Geräts (`binary_sensor`, endet auf „Frostgefahr“).
      selector:
        entity:
          filter:
            - domain: binary_sensor
    temperatur:
      name: Innentemperatur
      description: >-
        Der Sensor „Innentemperatur“ des Geräts. Er wird in die Meldung
        geschrieben.
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    benachrichtigung:
      name: Was soll passieren?
      description: >-
        Frei wählbar — Handymeldung, Heizung einschalten, Licht. Der Text steht
        in `{{ meldung }}` bereit.
      selector:
        action: {}

mode: single
max_exceeded: silent

variables:
  temperatur_entitaet: !input temperatur
  meldung: >-
    {% if temperatur_entitaet is string and temperatur_entitaet | length > 0
          and states(temperatur_entitaet) | is_number %}
      Frostgefahr im Fahrzeug: {{ (states(temperatur_entitaet) | float) | round(1)
        | string | replace('.', ',') }} °C.
    {% else %}
      Frostgefahr im Fahrzeug - die Temperatur liegt unter dem Grenzwert.
    {% endif %}

trigger:
  - platform: state
    entity_id: !input frost
    to: "on"

condition:
  # Nach einem Neustart von Home Assistant oder einem Verbindungsabbruch zum
  # Gerät springt der Melder von "nicht verfügbar" auf "an". Das ist keine
  # neue Lage: Wurde sie in den letzten zwölf Stunden schon gemeldet, nicht
  # noch einmal. Ein echter Wechsel von "aus" auf "an" meldet immer.
  - condition: template
    value_template: >-
      {{ trigger.from_state is none
         or trigger.from_state.state == 'off'
         or this.attributes.last_triggered is none
         or now() - this.attributes.last_triggered > timedelta(hours=12) }}

action:
  - choose: []
    default: !input benachrichtigung
