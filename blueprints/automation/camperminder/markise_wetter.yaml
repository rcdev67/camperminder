blueprint:
  name: CamperMinder - Wetterwächter Markise
  description: >-
    Meldet, bevor das Wetter der Markise schadet: Böen, Gewitter, Hagel,
    Schnee, Starkregen. Bei gewöhnlichem Regen kommt der Hinweis, die Markise
    auf einer Seite abzusenken. Steht sie waagerecht, sammelt sich das Wasser
    in der Mitte, und an diesem Wassersack brechen die meisten Markisen.


    Die Vorhersage bewertet die Integration CamperMinder. Dort unter
    *Konfigurieren* eine Wetter-Entität wählen, am besten Open-Meteo mit der
    Zone „Zuhause“: Die folgt dem Heimatort und liefert Böen. Die Grenzen für
    Böen, Wind, Regen und den Vorlauf stehen als Regler am Gerät
    *CamperMinder*. Dieselbe Warnung zeigt auch die Karte.


    Diese Automatisierung bringt die Meldung nur dorthin, wo du sie liest.
    Sie meldet, wenn der Melder auf „an“ springt. Solange die Gefahr bleibt,
    bleibt er an, und es kommt keine zweite Meldung.
  domain: automation
  source_url: https://github.com/rcdev67/camperminder/blob/main/blueprints/automation/camperminder/markise_wetter.yaml
  input:
    warnung:
      name: Markise Warnung
      description: Der Melder der Integration (`binary_sensor`, endet auf „Markise Warnung“).
      selector:
        entity:
          filter:
            - domain: binary_sensor
    benachrichtigung:
      name: Was soll passieren?
      description: >-
        Frei wählbar: Handymeldung, Lautsprecher, Licht. Der Text steht in
        `{{ meldung }}` bereit.
      selector:
        action: {}

mode: single
max_exceeded: silent

variables:
  warnung_entitaet: !input warnung

trigger:
  - platform: state
    entity_id: !input warnung
    to: "on"

condition:
  # Nach einem Neustart von Home Assistant springt der Melder von "nicht
  # verfügbar" auf "an". Das ist keine neue Lage: Wurde sie in den letzten
  # zwölf Stunden schon gemeldet, nicht noch einmal. Ein echter Wechsel von
  # "aus" auf "an" meldet immer.
  - condition: template
    value_template: >-
      {{ trigger.from_state is none
         or trigger.from_state.state == 'off'
         or this.attributes.last_triggered is none
         or now() - this.attributes.last_triggered > timedelta(hours=12) }}

action:
  - variables:
      meldung: >-
        {% set satz = state_attr(warnung_entitaet, 'meldung') %}
        {% if satz is string and satz | length > 0 %}
          {{ satz }}
        {% else %}
          Wetterwarnung für die Markise - bitte die Vorhersage prüfen.
        {% endif %}
  - choose: []
    default: !input benachrichtigung
