blueprint:
  name: CamperMinder Level - Wächteralarm
  description: >-
    Meldet, wenn das Fahrzeug seine Lage verlassen hat, während der Wächter
    scharf war — angehoben, aufgebockt, abgeschleppt.


    **Warum nicht „Lageänderung“?** Die ist ein Messwert und geht wieder aus,
    sobald das Fahrzeug in seine Lage zurückkommt. Wer schläft, verpasst sie.
    Der Wächter rastet ein und bleibt stehen, bis er quittiert wird — und er
    übersteht einen Stromausfall. Deshalb hängt diese Automatisierung an
    *Wächter Alarm*.


    Der Meldetext kommt vom Gerät und nennt die Uhrzeit, soweit das Gerät eine
    gültige Uhr hatte — auf einem Stellplatz ohne Internet nennt er stattdessen
    eine Zeitspanne.


    **Das ist eine Meldung über Home Assistant.** Sie erreicht dich nur, wenn
    Home Assistant dein Handy erreicht. Unabhängig davon kann das Gerät den
    Alarm selbst an einen Push-Dienst schicken (ntfy, Gotify, Telegram):
    Geräteseite → Technik → Fernalarm.
  domain: automation
  source_url: https://github.com/rcdev67/camperminder/blob/main/blueprints/automation/camperminder/waechter_alarm.yaml
  input:
    alarm:
      name: Wächter Alarm
      description: Der eingerastete Alarm (`binary_sensor`, endet auf „Wächter Alarm“).
      selector:
        entity:
          filter:
            - domain: binary_sensor
    text:
      name: Meldetext des Geräts
      description: >-
        Der Sensor „Wächter“ des Geräts. Er liefert den fertigen Satz, etwa
        „ALARM - Lage verändert am 22.08. um 03:14“.
      default: ""
      selector:
        entity:
          filter:
            - domain: sensor
    wiederholen:
      name: Wiederholen alle … Minuten
      description: >-
        Solange der Alarm nicht quittiert ist, erneut melden. 0 schaltet das
        ab. Ein Alarm um drei Uhr nachts, der einmal piept und dann schweigt,
        ist keiner.
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: box
    benachrichtigung:
      name: Was soll passieren?
      description: >-
        Frei wählbar — Handymeldung, Sirene, Licht, alles zusammen. Der Text
        steht in `{{ meldung }}` bereit. Für einen Alarm lohnt sich eine
        Meldung, die auch bei stillgestelltem Telefon durchkommt (bei der
        Home-Assistant-App unter `data.push.sound` bzw. `channel`).
      selector:
        action: {}

# restart statt single: Wird quittiert und löst der Wächter kurz danach
# erneut aus, muss das sofort gemeldet werden - nicht erst, wenn die Wartezeit
# des vorigen Durchlaufs abgelaufen ist.
mode: restart

variables:
  text_entitaet: !input text
  wiederholung: !input wiederholen

trigger:
  - platform: state
    entity_id: !input alarm
    to: "on"

action:
  # Der Melder springt sofort, den Satz schreibt das Gerät einmal pro Sekunde
  # neu. Ohne die Pause stünde in der Meldung noch "scharf seit 2 h".
  - delay:
      seconds: 2
  - variables:
      meldung: >-
        {% if text_entitaet is string and text_entitaet | length > 0
              and states(text_entitaet) not in ['unknown', 'unavailable', ''] %}
          {{ states(text_entitaet) }}
        {% else %}
          Das Fahrzeug hat seine Lage verlassen - der Wächter hat ausgelöst.
        {% endif %}
  - choose: []
    default: !input benachrichtigung
  # Wiederholen, solange nicht quittiert - quittiert wird am Gerät oder über
  # den Knopf "Alarm quittieren". Gewartet wird auf das Quittieren selbst:
  # Dann endet die Schleife sofort und nicht erst nach Ablauf der Minuten.
  - condition: template
    value_template: "{{ (wiederholung | int(0)) > 0 }}"
  - repeat:
      while:
        - condition: state
          entity_id: !input alarm
          state: "on"
      sequence:
        - wait_for_trigger:
            - platform: state
              entity_id: !input alarm
              to: "off"
          timeout:
            minutes: !input wiederholen
          continue_on_timeout: true
        - condition: state
          entity_id: !input alarm
          state: "on"
        # Neu lesen: Ohne Uhr nennt das Gerät eine Zeitspanne ("vor 3 min"),
        # und die stimmt bei der Wiederholung nicht mehr.
        - variables:
            meldung: >-
              {% if text_entitaet is string and text_entitaet | length > 0
                    and states(text_entitaet) not in ['unknown', 'unavailable', ''] %}
                {{ states(text_entitaet) }}
              {% else %}
                Das Fahrzeug hat seine Lage verlassen - der Wächter hat ausgelöst.
              {% endif %}
        - choose: []
          default: !input benachrichtigung
