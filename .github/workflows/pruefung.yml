# Prüft bei jedem Push, ob die Integration den Anforderungen von Home Assistant
# entspricht. Ohne diese Prüfung fällt eine verschärfte Anforderung erst beim
# Anwender auf - und dort als Störung statt als Fehlermeldung.
name: Prüfung

on:
  push:
  pull_request:
  # Wöchentlich auch ohne Änderung: Home Assistant verschärft die Anforderungen
  # an manifest.json von Zeit zu Zeit. So fällt das auf, bevor die nächste
  # Veröffentlichung ansteht.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant (hassfest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

# ---------------------------------------------------------------------------
# Warum hier keine HACS-Prüfung läuft
#
# Sie setzt eine Lizenz voraus, die GitHub selbsttätig einer der bekannten
# Vorlagen zuordnen kann. CamperMaid steht unter eigenen Bedingungen
# (siehe LICENSE), die GitHub folgerichtig als "nicht zugeordnet" ausweist.
# Diese eine Prüfung lässt sich als einzige nicht übergehen - sie würde also
# dauerhaft fehlschlagen und die übrigen Ergebnisse unlesbar machen.
#
# Auf die Installation hat das keinen Einfluss. Die Prüfung entscheidet allein
# über die Aufnahme in den HACS-Standardkatalog. Das Einbinden über
# "eigenes Repository" ist davon unberührt und in docs/ beschrieben.
# ---------------------------------------------------------------------------
