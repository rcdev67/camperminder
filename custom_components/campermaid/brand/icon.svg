<!--
  Quelle fuer icon.png und icon@2x.png dieser Integration.

  Identisch mit brand/campermaid-mark.svg, nur senkrecht zentriert: Die Marke
  sitzt in ihrer eigenen Zeichenflaeche unten, weil die Raeder ueber den
  Fahrzeugkoerper hinausragen. Fuer ein quadratisches Icon muss sie mittig
  stehen, sonst wirkt sie in der Kachel abgesackt.

  Das Feld beginnt bei 8 und ist 84 Einheiten breit statt 100. Grund: Die Form
  liegt bei x 8 bis 92, fuellt die Breite damit vollstaendig aus. Die Vorgaben
  von home-assistant/brands verlangen moeglichst wenig Leerraum am Rand, und in
  der kleinen Liste von HACS traegt jedes Prozent. Senkrecht bleibt Luft - das
  Motiv ist nun einmal breiter als hoch.

  Einfarbig mit ausgesparten Radnaben - siehe Begruendung in
  brand/campermaid-mark.svg. Nicht in zwei Farben aendern: Das Icon liegt mit
  Transparenz vor und erscheint auf hellem wie auf dunklem Grund.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 84 84" width="100%" height="100%">
  <g transform="translate(0 -3.25)">
    <path fill="#2fb6c9" fill-rule="evenodd" d="
      M8 64 L8 46 Q8 43 11 42 L30 30 Q32 29 35 29 L88 29 Q92 29 92 33 L92 62
      Q92 65 89 65 L84.5 65 A10.5 10.5 0 0 0 63.5 65 L40.5 65
      A10.5 10.5 0 0 0 19.5 65 L11 65 Q8 65 8 64 Z

      M30 56.5 A10.5 10.5 0 1 1 30 77.5 A10.5 10.5 0 1 1 30 56.5 Z
      M30 63 A4 4 0 1 0 30 71 A4 4 0 1 0 30 63 Z

      M74 56.5 A10.5 10.5 0 1 1 74 77.5 A10.5 10.5 0 1 1 74 56.5 Z
      M74 63 A4 4 0 1 0 74 71 A4 4 0 1 0 74 63 Z
    "/>
  </g>
</svg>
