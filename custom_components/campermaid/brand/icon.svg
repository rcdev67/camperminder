<!--
  Quelle fuer icon.png und icon@2x.png dieser Integration.

  Identisch mit brand/campermaid-mark.svg, nur senkrecht zentriert: Die Marke
  sitzt in ihrer eigenen Zeichenflaeche unten, weil die Raeder ueber den
  Fahrzeugkoerper hinausragen. Fuer ein quadratisches Icon muss sie mittig
  stehen, sonst wirkt sie in der Kachel abgesackt.

  Einfarbig mit ausgesparten Radnaben - siehe Begruendung in
  brand/campermaid-mark.svg. Nicht in zwei Farben aendern: Das Icon liegt mit
  Transparenz vor und erscheint auf hellem wie auf dunklem Grund.
-->
