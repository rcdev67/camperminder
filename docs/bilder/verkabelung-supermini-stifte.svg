<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 404 324" width="404" height="324" role="img" aria-label="Draufsicht ESP32-C3 SuperMini mit USB-C oben. Linke Stiftreihe von oben: 5V, G, 3.3, danach GPIO 0 bis 4. Rechte Stiftreihe von oben: 5, 6, 7, 8, 9, 10, danach 20 und 21. Benutzt werden 5V oder 3.3, G, 5, 6 und 10.">
<title>Draufsicht ESP32-C3 SuperMini mit USB-C oben. Linke Stiftreihe von oben: 5V, G, 3.3, danach GPIO 0 bis 4. Rechte Stiftreihe von oben: 5, 6, 7, 8, 9, 10, danach 20 und 21. Benutzt werden 5V oder 3.3, G, 5, 6 und 10.</title>
<style>
.bg{fill:#ffffff;stroke:#d3dae1;stroke-width:1}
.blk{fill:#f6f8fa;stroke:#d3dae1;stroke-width:1.5}
.pad{fill:#ffffff;stroke:#8b96a2;stroke-width:2}
.pad-dim{fill:#ffffff;stroke:#b1bac3;stroke-width:1.5}
.pad-acc{fill:#ffffff;stroke:#1b8292;stroke-width:2.5}
.lbl{fill:#1b2430;font:500 13px Consolas,'DejaVu Sans Mono','Courier New',monospace}
.lbl-dim{fill:#a3adb7;font:500 13px Consolas,'DejaVu Sans Mono','Courier New',monospace}
.fn{fill:#5a6675;font:400 11.5px Consolas,'DejaVu Sans Mono','Courier New',monospace}
.ttl{fill:#1b2430;font:700 15px 'Segoe UI',Helvetica,Arial,sans-serif}
.note{fill:#5a6675;font:400 12px 'Segoe UI',Helvetica,Arial,sans-serif}
.wlab{fill:#5a6675;font:600 10.5px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.05em}
.w{fill:none;stroke-width:4;stroke-linecap:round}
.w-red{stroke:#cc3333}.w-blue{stroke:#2a64c5}.w-yellow{stroke:#c29400}.w-gnd{stroke:#1b2430}
.w-opt{fill:none;stroke:#1b8292;stroke-width:3;stroke-dasharray:7 6;stroke-linecap:round}
.sym{fill:none;stroke:#1b2430;stroke-width:2;stroke-linecap:round}
.piezo{fill:#ffffff;stroke:#1b8292;stroke-width:2.5}
.board{fill:#e4eaee;stroke:#c3ccd4;stroke-width:1.5}
.usb{fill:#d3dae1;stroke:#8b96a2;stroke-width:1.5}
.chip{fill:none;stroke:#b1bac3;stroke-width:1.5;stroke-dasharray:4 4}
.f-red{fill:#cc3333}.f-blue{fill:#2a64c5}.f-yellow{fill:#c29400}.f-gnd{fill:#1b2430}.f-acc{fill:#1b8292}
</style>
<rect class="bg" x="-11" y="-11" width="403" height="323" rx="10"/>
          <text class="ttl" x="190" y="16" text-anchor="middle">USB-C</text>
          <rect class="board" x="120" y="38" width="140" height="252" rx="10"/>
          <rect class="usb" x="160" y="26" width="60" height="24" rx="6"/>
          <rect class="chip" x="162" y="124" width="56" height="56" rx="4"/>
          <text class="lbl-dim" x="190" y="157" text-anchor="middle">C3</text>

          <!-- linke Reihe -->
          <circle class="f-red" cx="140" cy="72" r="7"/>
          <text class="lbl" x="112" y="76" text-anchor="end"><tspan class="fn">MPU</tspan> 5V</text>
          <circle class="f-gnd" cx="140" cy="100" r="7"/>
          <text class="lbl" x="112" y="104" text-anchor="end">G</text>
          <circle class="f-red" cx="140" cy="128" r="7"/>
          <text class="lbl" x="112" y="132" text-anchor="end"><tspan class="fn">LSM</tspan> 3.3</text>
          <circle class="pad-dim" cx="140" cy="156" r="6"/>
          <circle class="pad-dim" cx="140" cy="184" r="6"/>
          <circle class="pad-dim" cx="140" cy="212" r="6"/>
          <circle class="pad-dim" cx="140" cy="240" r="6"/>
          <circle class="pad-dim" cx="140" cy="268" r="6"/>
          <text class="lbl-dim" x="112" y="216" text-anchor="end">GPIO 0–4</text>

          <!-- rechte Reihe -->
          <circle class="f-blue" cx="240" cy="72" r="7"/>
          <text class="lbl" x="268" y="76">5<tspan class="fn" dx="8">SDA</tspan></text>
          <circle class="f-yellow" cx="240" cy="100" r="7"/>
          <text class="lbl" x="268" y="104">6<tspan class="fn" dx="8">SCL</tspan></text>
          <circle class="pad-dim" cx="240" cy="128" r="6"/>
          <text class="lbl-dim" x="268" y="132">7</text>
          <circle class="pad-acc" cx="240" cy="156" r="6"/>
          <text class="lbl" x="268" y="160">8<tspan class="fn" dx="8">LED intern</tspan></text>
          <circle class="pad-dim" cx="240" cy="184" r="6"/>
          <text class="lbl-dim" x="268" y="188">9</text>
          <circle class="f-acc" cx="240" cy="212" r="7"/>
          <text class="lbl" x="268" y="216">10<tspan class="fn" dx="8">Piezo</tspan></text>
          <circle class="pad-dim" cx="240" cy="240" r="6"/>
          <circle class="pad-dim" cx="240" cy="268" r="6"/>
          <text class="lbl-dim" x="268" y="258">20 · 21</text>
        </svg>
