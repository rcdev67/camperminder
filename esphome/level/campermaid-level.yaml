# ============================================================================
#  CamperMaid  -  Produktfirmware
# ----------------------------------------------------------------------------
#  DIES IST DIE AUSZULIEFERNDE FASSUNG. Eine Firmware, die beides kann:
#
#    * Standalone - eigene Bedienoberflaeche auf dem Geraet (web_server unten),
#      erreichbar ueber das Camper-WLAN oder das eigene Fallback-Netz des
#      Geraets. Ohne Home Assistant, ohne Internet, ohne App.
#    * Home Assistant - ueber api: mit der Integration campermaid.
#
#  Bewusst NICHT zwei getrennte Firmwares: zwei Staende hiessen zwei
#  Testlaeufe, zwei Update-Kanaele und die Gewissheit, dass irgendwann ein
#  Geraet den falschen Stand bekommt. Ausserdem koennte ein Kunde ohne Home
#  Assistant es dann nicht nachruesten, ohne die Firmware zu wechseln.
#  Wer HA nicht nutzt, merkt von api: schlicht nichts.
#
#  Erwartet Eintraege in der secrets.yaml (siehe secrets.yaml.example).
#
#  Fuer Selbstbauer ohne secrets.yaml gibt es weiterhin
#  campermaid-level-komplett.yaml zum Einfuegen in einem Rutsch. Die bringt
#  die ESPHome-Standardseite mit statt der eigenen Oberflaeche - ein
#  js_include zeigt auf eine Datei neben der YAML, und die haette dort
#  niemand. Siehe INSTALL.md.
# ============================================================================

substitutions:
  device_name: campermaid-level
  friendly_name: CamperMaid Level
  # WLAN-Stromsparen: "none" = niedrigste Latenz (Werkseinstellung dieses
  # Projekts), "light" spart im Dauerbetrieb spuerbar Strom aus der
  # Aufbaubatterie, kostet etwas Reaktionszeit. "high" nur fuer Messungen.
  wifi_power_save: "none"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: CamperMaid - ESP32-C3 + MPU-6050 + OLED

  # Ohne diesen Block waere die Update-Pruefung wertlos. Der Quelltext von
  # http_request_update.cpp:
  #
  #     #ifdef ESPHOME_PROJECT_VERSION
  #         info->current_version = ESPHOME_PROJECT_VERSION;
  #     #else
  #         info->current_version = ESPHOME_VERSION;
  #
  # Fehlt project.version, vergleicht das Geraet also die ESPHome-Version
  # (2026.7.3) mit der Version im Manifest. Die stimmen nie ueberein
  # - das Geraet meldete dauerhaft "Update verfuegbar", auch direkt nach dem
  # Aktualisieren.
  project:
    name: "campermaid.level"
    version: "${firmware_version}"

  # Ein Uebersetzungsvorgang statt so vieler, wie der Rechner Kerne hat.
  #
  # Ohne diese Zeile startet ninja mehrere cc1plus gleichzeitig, und jeder
  # davon braucht bei esp-idf mehrere hundert Megabyte. Auf einem kleinen
  # Home-Assistant-Rechner greift dann der Speicherwaechter des Systems und
  # erschlaegt den Compiler mitten im Lauf:
  #
  #     riscv32-esp-elf-g++: fatal error: Killed signal terminated program cc1plus
  #
  # Das sieht nach einem Codefehler aus, ist aber reiner Speichermangel. Der
  # Bau dauert dadurch laenger und geht dafuer durch.
  compile_process_limit: 1

esp32:
  board: esp32-c3-devkitm-1

logger:
  level: INFO

api:
  encryption:
    key: !secret campermaid_api_key

ota:
  # Fuer Entwicklung und Werkstatt: aus dem ESPHome-Dashboard heraus.
  - platform: esphome
    password: !secret campermaid_ota_password
  # Fuer ausgelieferte Geraete: das Geraet holt sich das Update selbst.
  - platform: http_request
  # Fuer den Fall ohne Internet: Datei vom Handy hochladen. Auf dem
  # Stellplatz spannt das Geraet sein eigenes Netz auf - dort gibt es keinen
  # Weg nach draussen, und der Weg ueber GitHub kann gar nicht funktionieren.
  - platform: web_server

http_request:
  # Bleibt bei der Voreinstellung true, prueft also das Zertifikat von GitHub.
  # Scheitert der Handschlag auf dem Geraet, hier verify_ssl: false setzen -
  # dann faellt allerdings die Echtheitspruefung weg und ein Angreifer im
  # selben Netz koennte eigene Firmware unterschieben. Erst versuchen, dann
  # abschalten, nicht umgekehrt.

# Alles ueber GitHub-Releases. "latest/download/<datei>" zeigt immer auf die
# neueste Veroeffentlichung - die Adressen aendern sich also nie, weder in der
# Firmware noch in der Dokumentation. Neue Version heisst: Release anlegen,
# Dateien anhaengen, fertig.
#
# Automatische Pruefung - erzeugt in Home Assistant eine Update-Entitaet unter
# Einstellungen -> System -> Updates.
#
# update_interval bewusst 12h statt der voreingestellten 6h: ein Wohnmobil
# steht oft ohne Netz, haeufigeres Nachfragen kostet nur Strom und Funk.
update:
  - platform: http_request
    name: "Firmware"
    source: https://github.com/rcdev67/campermaid/releases/latest/download/level-manifest.json
    update_interval: 12h

# Aktualisierung von Hand - der Weg fuer die Betriebsart ohne Home Assistant.
# Fuer Update-Entitaeten dokumentiert ESPHome keinen REST-Endpunkt, fuer
# Tasten schon. Die Geraeteseite kann diese Taste also druecken; in Home
# Assistant erscheint sie zusaetzlich als gewoehnlicher Knopf.
#
# Die Adressen sind fest: "latest/download" loest GitHub selbst auf die
# neueste Veroeffentlichung auf.
button:
  - platform: template
    name: "Firmware aktualisieren"
    id: firmware_update
    icon: mdi:cloud-download
    entity_category: config
    on_press:
      - ota.http_request.flash:
          url: https://github.com/rcdev67/campermaid/releases/latest/download/level-firmware.ota.bin
          md5_url: https://github.com/rcdev67/campermaid/releases/latest/download/level-firmware.ota.bin.md5

  # Setzt den Einstellungsbereich des Flash zurueck: WLAN-Zugangsdaten,
  # Kalibrierung, Fahrzeugmasse. Danach startet das Geraet neu und oeffnet
  # wieder sein eigenes Netz - Auslieferungszustand.
  #
  # Warum das noetig ist: Ein OTA-Update laesst diesen Bereich absichtlich
  # unangetastet, und Home Assistant kann ihn gar nicht erreichen. Ohne diese
  # Taste bliebe nur serielles Aufspielen mit Loeschen - also Kabel und
  # Rechner. Fuer Weiterverkauf, Umzug oder einen Test des Erstablaufs ist das
  # keine zumutbare Antwort.
  - platform: factory_reset
    name: "Werkseinstellungen"
    id: factory_reset_button
    icon: mdi:backup-restore
    entity_category: config

  # WLAN-Einrichtung von der Geraeteseite aus. Uebernimmt die Aufgabe des
  # Captive Portals, das dafuer entfaellt - siehe Begruendung dort.
  #
  # save_wifi_sta ist dieselbe Funktion, die auch das Captive Portal benutzt.
  # Sie ist keine offiziell zugesicherte Schnittstelle; benennt ESPHome sie
  # um, ist es diese eine Zeile.
  - platform: template
    name: "WLAN speichern"
    id: wifi_save
    icon: mdi:wifi-cog
    entity_category: config
    on_press:
      - lambda: |-
          wifi::global_wifi_component->save_wifi_sta(
              id(wifi_ssid_input).state, id(wifi_pass_input).state);
      # Sechs Sekunden, nicht zwei: Die Seite wartet vorher auf die
      # Bestaetigung des Geraets ueber den Ereignisstrom und zeigt danach
      # erst ihre Schlussmeldung an. Startet das Geraet zu frueh neu, reisst
      # die Verbindung ab, bevor der Nutzer erfaehrt, ob es geklappt hat.
      - delay: 6s
      - lambda: 'App.safe_reboot();'

# Eingabefelder fuer die WLAN-Einrichtung.
#
# Bewusst ohne restore_value: das Passwort soll nicht dauerhaft im Klartext
# im Flash liegen. Es wird nur gehalten, bis der Knopf oben es an die
# WLAN-Verwaltung uebergibt - dort ist es richtig aufgehoben.
text:
  - platform: template
    name: "WLAN Name"
    id: wifi_ssid_input
    icon: mdi:wifi
    entity_category: config
    mode: text
    min_length: 0
    max_length: 32
    optimistic: true

  - platform: template
    name: "WLAN Passwort"
    id: wifi_pass_input
    icon: mdi:form-textbox-password
    entity_category: config
    mode: password
    min_length: 0
    max_length: 64
    optimistic: true

# Ab Werk ohne Zugangsdaten - und das ist kein Versehen, sondern Bedingung.
#
# Die ESPHome-Dokumentation dazu: "as long as no credentials are set in the
# config file, and firmware is uploaded without erasing the flash (via OTA),
# the device will keep the saved credentials." Nur ohne Eintrag hier bleibt
# also erhalten, was der Kunde auf der Geraeteseite eintraegt.
#
# Steht hier ein WLAN, waere es ausserdem deins - in jedem verkauften Geraet.
#
# FOLGE FUER UPDATES: nur ueber OTA aktualisieren. Ein serielles Aufspielen
# mit Loeschen des Flash nimmt dem Kunden sein eingerichtetes WLAN wieder weg.
#
# reboot_timeout stoert hier nicht: es gilt laut Dokumentation nicht im
# Zugangspunkt-Betrieb, und dorthin wechselt das Geraet nach ap_timeout von
# selbst. Ein Neustart-Karussell im Normalbetrieb gibt es also nicht.
wifi:
  power_save_mode: ${wifi_power_save}
  reboot_timeout: 10min

  # Eigenes Netz, wenn kein WLAN erreichbar ist - und der Dauerzustand fuer
  # alle, die gar keins haben. Das Handy verbindet sich damit und erreicht
  # die Geraeteseite unter der festen Adresse unten.
  #
  # Die Adresse steht ausdruecklich da, obwohl sie ESPHomes Voreinstellung
  # ist: Sie gehoert in jede Anleitung und auf jeden Aufkleber, und ein
  # stillschweigender Vorgabewert ist das Letzte, worauf man sich dabei
  # verlassen sollte.
  ap:
    ssid: "CamperMaid"
    password: !secret campermaid_fallback_password
    # 20 Sekunden statt der voreingestellten 90: Wer auf dem Stellplatz
    # ankommt und ausrichten will, wartet sonst anderthalb Minuten auf eine
    # Anzeige. Ein hinterlegtes Heimnetz bekommt immer noch reichlich Zeit.
    #
    # Gehoert hierher und nicht eine Ebene hoeher - dort weist ESPHome es ab.
    ap_timeout: 20s
    manual_ip:
      static_ip: 192.168.4.1
      gateway: 192.168.4.1
      subnet: 255.255.255.0

# KEIN captive_portal - bewusst.
#
# Sein canHandle beansprucht JEDE GET-Anfrage, solange es aktiv ist:
#
#     return this->active_ && request->method() == HTTP_GET;
#
# Kein Pfad- und kein Adressfilter. Im eigenen Netz - also genau im
# Standalone-Betrieb - haette der Kunde damit nie die Wasserwaage gesehen,
# sondern immer die WLAN-Einrichtung. Eine zweite IP oder ein anderer Port
# aendert daran nichts, weil beide Komponenten sich denselben Webserver
# teilen.
#
# Die WLAN-Einrichtung liegt deshalb auf unserer eigenen Seite (Felder und
# Knopf weiter oben). Ergebnis: eine Adresse fuer alles.

# Sensorik, OLED, Kalibrierung und Geraete-Webseite - die einzige Quelle
# dafuer. Nichts davon hier duplizieren.
#
# Der Unterordner ist Absicht: Das ESPHome-Dashboard listet nur YAML-Dateien
# der obersten Ebene als Geraet. Lag der Baustein daneben, erschien er als
# eigene Kachel - rot markiert, weil ihm zwangslaeufig esphome: und board:
# fehlen, und jederzeit versehentlich installierbar.
packages:
  hardware: !include hardware.yaml

# Eigene Oberflaeche statt der ESPHome-Entitaetenliste.
#
# Bewusst nur hier und nicht im Paket: campermaid-level-komplett.yaml wird
# daraus erzeugt und ist zum Einfuegen in einem Rutsch gedacht. Ein
# js_include zeigt auf eine Datei neben der YAML - die haette dort niemand.
#
# css_url und js_url leer raeumen die Standardoberflaeche ab, js_include
# liefert unsere Datei als /0.js aus. Damit laedt die Seite nichts aus dem
# Netz und funktioniert auf dem Stellplatz - local: true waere dafuer
# zustaendig, wird durch die drei Zeilen aber ueberfluessig und kollidiert
# mit js_include.
#
# Geht etwas schief: die vier Zeilen entfernen, dann ist die gewohnte
# ESPHome-Seite wieder da.
web_server:
  local: false
  css_url: ""
  js_url: ""
  js_include: "./webui.js"
