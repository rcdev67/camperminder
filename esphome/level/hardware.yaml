# ============================================================================
#  CamperMinder  -  Hardware und Messlogik
# ----------------------------------------------------------------------------
#  Enthält ausschließlich das Projektspezifische: Sensorik, OLED-Anzeige,
#  Kalibrierung und Geräte-Webseite.
#
#  Bewusst NICHT enthalten: esphome:, wifi:, api:, ota:, captive_portal:.
#  Diese Blöcke erzeugt der ESPHome-Assistent beim Anlegen eines neuen Geräts
#  bereits selbst - mitsamt zufälligem API-Schlüssel und Passwörtern. Wer sie
#  hier noch einmal mitliefern würde, zwänge jeden Nutzer dazu, von Hand
#  Einträge in seine secrets.yaml zu schreiben. Genau das soll entfallen.
#
#  Verwendung - NICHT den Inhalt in die Gerätedatei kopieren! Diese Datei
#  bringt eigene esphome:- und esp32:-Blöcke mit; untereinandergeschrieben
#  ergäbe das doppelte Schlüssel und einen YAML-Fehler. Stattdessen als
#  PAKET einbinden, dann führt ESPHome die Blöcke sauber zusammen:
#
#  A) Datei nach /config/esphome/camperminder/ legen - also in einen
#     UNTERORDNER, nicht neben die Gerätedatei. Grund: Das ESPHome-Dashboard
#     listet jede YAML-Datei der obersten Ebene als Gerät. Lag diese Datei
#     dort, erschien sie als eigene Kachel, rot markiert (ihr fehlen
#     zwangsläufig esphome: und board:) und jederzeit versehentlich
#     installierbar. Im Unterordner verschwindet sie aus der Liste.
#
#     Dann in der Gerätedatei am Ende:
#
#        packages:
#          camperminder: !include hardware.yaml
#
#  B) Oder direkt von GitHub, ohne die Datei abzulegen (setzt ein
#     öffentliches Repository voraus):
#
#        packages:
#          camperminder: github://rcdev67/camperminder/esphome/level/hardware.yaml@main
#
#  Hat die Gerätedatei eine Zeile "framework:", lösche sie - sonst gilt sie
#  statt der hier eingestellten.
#
#  WICHTIG: Im Assistenten muss als Gerätetyp ESP32-C3 gewählt sein. Steht in
#  der erzeugten Datei "board: esp32dev", auf "board: esp32-c3-devkitm-1"
#  ändern - sonst passen die Pins nicht.
# ============================================================================

substitutions:
  # Firmware und Integration tragen IMMER dieselbe Nummer. Sie steht in dieser
  # Datei und in custom_components/camperminder/manifest.json;
  # tools/build_release.ps1 vergleicht beide und bricht bei Abweichung ab.
  #
  # Der Grund ist der Nutzer: Zwei verschiedene Nummern für EIN Gerät lassen
  # sich niemandem erklären - wer in HACS die eine und auf der Geräteseite die
  # andere sieht, weiß nicht mehr, welchen Stand er hat. Dazu kommt, dass eine
  # Änderung auf der einen Seite fast immer eine auf der anderen nach sich
  # zieht; die beiden gehören zusammen.
  #
  # Eigenständig zählen die PRODUKTE, nicht die Bestandteile eines Produkts:
  # CamperMinder Gas bekommt später eine eigene Nummer, damit eine Änderung an
  # der Gaswaage nicht jedem Nivelliergerät ein Update aufzwingt.
  #
  # Sie muss zeichengleich im Update-Manifest stehen: Die Prüfung im Gerät
  # vergleicht genau diese Zeichenkette. Weicht sie ab, meldet das Gerät
  # dauerhaft "Update verfügbar".
  # Ein Bindestrich macht die Nummer zur Vorabfassung: "2.0.4-rc1" statt
  # "2.0.4". Daran erkennen die Werkzeuge, dass dieser Stand NICHT
  # veröffentlicht werden soll - Einzelheiten in docs/firmware_update.md.
  firmware_version: "3.5.2"

  # I2C-Pins (0,42"-OLED-Board): SDA=GPIO5, SCL=GPIO6
  i2c_sda_pin: GPIO5
  i2c_scl_pin: GPIO6
  # Vorgabe für "Toleranz genau" - die Gradtoleranz des Präzisionsmodus.
  # Nur der Anfangswert; verstellt wird sie danach über die Entität, damit
  # dafür niemand flashen muss. Muss zu DEFAULT_TOLERANCE_DEG in
  # custom_components/camperminder/const.py passen.
  level_tolerance_deg: "0.4"

  # Vorgabe für "Haltebereich" in Prozent: Einmal "eben" bleibt "eben", bis die
  # Neigung um diesen Anteil über die Toleranz hinausgeht. Ohne diese Hysterese
  # entscheidet sich an einem einzigen Punkt, ob das Fahrzeug steht - und genau
  # auf diesem Punkt rauscht der Messwert.
  #
  # Auch das ist nur der Anfangswert; verstellt wird zur Laufzeit. Muss zu
  # LEVEL_RELEASE in const.py passen - die Zahl dort gilt, solange kein Gerät
  # den Wert führt, etwa bei einem fremden Neigungssensor.
  level_release_default: "125"
  # Achsen-Vorzeichen - nur "1" oder "-1".
  # Konvention: pitch > 0 = Front höher, roll > 0 = rechte Seite höher.
  pitch_sign: "1"
  roll_sign: "1"
  # Achs-ZUORDNUNG: auf welcher Beschleunigungsachse liegt welche Neigung?
  # Nur "x" oder "y" (z ist immer die Schwerkraft-Achse).
  #
  # Die vier Werte oben und hier gelten für den Serienaufbau: MPU6050 flach auf
  # die Lochrasterplatine gelötet, Gehäuse mit dem Pfeil nach vorn, Deckel oben.
  # Am fertigen Prototyp geprüft - Front anheben gibt positiven Pitch, rechte
  # Seite anheben positiven Roll.
  #
  # Frühere Fassungen dieses Kommentars nannten "y / x" den Standard-Einbau.
  # Das war falsch beschriftet, nicht falsch eingestellt: Die Werte stimmten,
  # die Erklärung daneben nicht. Wer den Sensor um 90 Grad gedreht aufbaut,
  # tauscht auf "y / x" - Verfahren in docs/kalibrierung.md.
  #
  # Wird an ALLEN drei Stellen benutzt (Pitch, Roll, Kalibrier-Button) - genau
  # deshalb als Substitution: eine falsch mitgezogene Stelle war hier schon
  # einmal die Ursache dafür, dass Anzeige und gespeicherter Offset
  # auseinanderliefen.
  axis_pitch: "x"
  axis_roll: "y"

  # Ab welcher Summe der drei Drehraten - gemessen ALS ABWEICHUNG VOM
  # gelernten Nullpunkt, nicht als Absolutwert - Bewegung gilt. Bei einem
  # ruhenden MPU6050 bleibt das Rauschen deutlich darunter.
  motion_deg_s: "3.0"

  # --- Ruhige Anzeige: adaptive Glättung -----------------------------------
  #
  # Das Problem, das diese Rechnung löst: Ein Grad Neigung sind rund 17
  # Milli-g. Das Rauschen eines MPU6050 liegt in derselben Größenordnung, und
  # über einen Radstand von 3500 mm werden aus zwei, drei Zehntelgrad ein
  # ganzer Zentimeter. Bei 5 cm Toleranz sprang die Anzeige dadurch im Stand
  # zwischen 4,3 und 5,2 cm hin und her - das Fahrzeug stand längst, die
  # Anzeige aber nicht.
  #
  # Ein einfacher Tiefpass löst das nicht: Stark genug eingestellt, um das
  # Rauschen wegzunehmen, hinkt er beim Auffahren auf den Keil sekundenlang
  # hinterher - und genau da zählt jede Sekunde.
  #
  # Deshalb hängt die Trägheit davon ab, WIE WEIT der Messwert vom
  # geglätteten Wert abweicht:
  #
  #   bis zur Rauschgrenze - das ist Rauschen. Sehr träge, die Anzeige steht
  #                          still, solange das Fahrzeug still steht.
  #   ab der Bewegungsgrenze - das ist eine echte Lageänderung. Voll flott.
  #   dazwischen           - linear überblendet.
  #
  # Warum das beim Auffahren trotzdem sofort reagiert: Verglichen wird der
  # Rohwert mit dem GEGLÄTTETEN Wert, nicht mit dem vorherigen Rohwert. Rollt
  # das Fahrzeug, läuft der geglättete Wert dem Rohwert nach - der Abstand
  # wächst binnen Zehntelsekunden über die Rauschgrenze, und ab da folgt die
  # Glättung wieder flott. Zusätzlich schaltet der Bewegungssensor sofort auf
  # flott, bevor der Abstand überhaupt aufläuft.
  #
  # Genauigkeit geht dabei nicht verloren: Ein exponentieller Mittelwert hat
  # keinen toten Bereich, er läuft jeder echten Änderung vollständig nach -
  # nur eben langsam, solange sie klein ist.
  #
  # WAS HIER STEHT, IST NUR DIE ABBILDUNG - eingestellt wird zur Laufzeit.
  #
  # Wie ruhig eine Anzeige sein soll, ist Geschmack: Der eine will, dass sie
  # steht wie angenagelt, der andere will jede Regung sehen. Das lässt sich
  # nicht ab Werk entscheiden, und es über eine Substitution zu regeln hieße,
  # jeden Nutzer zum Flashen zu zwingen. Deshalb gibt es EINEN Regler
  # "Anzeigeruhe" (0 bis 10), und diese sechs Zahlen rechnen ihn in die vier
  # Beiwerte des Filters um:
  #
  #   Rauschgrenze = base + Ruhe * step        bei Ruhe 5:  0,25 Grad
  #
  # Zur Abbildung von alpha: Sie ist quadratisch, nicht linear, und beginnt bei
  # Ruhe 0 mit 1,0 - also GAR KEINER Glättung. Die erste Fassung begann bei
  # 0,10, und damit lag der gesamte Regelbereich unter der Auflösung der
  # Anzeige: Jede Stellung sah gleich aus, der Regler wirkte kaputt. Jetzt
  # spannt er von "roh" bis "rund 24 s Zeitkonstante", und 5 trifft weiterhin
  # genau den Wert, mit dem 3.1.0 erprobt wurde.
  #   Bewegung ab  = Rauschgrenze * faktor                  1,50 Grad
  #   alpha träge  = zaehler / (1 + Ruhe)                   0,0167  (~6 s)
  #   alpha flott  = fast_base - Ruhe * fast_step           0,50
  #
  # Ein Regler und nicht vier: Die vier Beiwerte beschreiben EINE Eigenschaft
  # aus vier Richtungen. Einzeln verstellbar wären sie in der Hand eines
  # Nutzers kein Werkzeug, sondern eine Falle - man kann sie gegeneinander
  # stellen und bekommt eine Anzeige, die weder ruhig ist noch reagiert.
  #
  # Ruhe 5 ergibt exakt das Verhalten, mit dem 2.0.5 ausgeliefert wurde. Wer
  # die Abbildung ändert, verschiebt damit die Voreinstellung für alle.
  calm_default: "5"
  calm_noise_base: "0.05"
  calm_noise_step: "0.04"
  calm_move_faktor: "6.0"
  calm_slow_faktor: "2.36"
  calm_fast_base: "0.60"
  calm_fast_step: "0.02"

# Board-Feinheiten, die der Assistent nicht setzt. "board:" kommt bewusst aus
# der Gerätedatei, damit die Wahl im Assistenten gilt.
esp32:
  flash_size: 4MB
  framework:
    type: esp-idf

# --- Eigenes Netz: offen, bis der Nutzer es abschliesst ---------------------
#
# Das Geraet spannt sein eigenes Netz nur auf, solange kein WLAN eingetragen
# ist - also im Handbetrieb und waehrend der Einrichtung. Es ist dann OFFEN,
# ohne Passwort.
#
# Warum offen die richtige Voreinstellung ist: Ein Passwort ab Werk muesste
# entweder fuer alle Geraete gleich sein (dann steht es nach dem ersten
# verkauften Geraet in jedem Forum) oder je Geraet verschieden (dann braucht
# es einen Aufkleber, und nach Werkseinstellungen stimmt der nicht mehr - bei
# einer Ausfuehrung ohne Display waere der Besitzer ausgesperrt). Beides war
# gebaut und beides war schlechter als das hier.
#
# Wer es abschliessen will, traegt unter Technik ein eigenes Passwort ein.
# Dann gilt seines, und zwar bis er es wieder loescht.
#
# Laeuft VOR dem WLAN: Prioritaet 600 gegen dessen 250. Spaeter waere das Netz
# bereits offen.
esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: |-
            // Leer heisst offen - dann bleibt die Einstellung aus der
            // Geraetedatei stehen, und die kennt kein Passwort.
            const size_t laenge = strlen(id(ap_passwort));
            if (laenge == 0) {
              ESP_LOGI("netz", "Eigenes Netz ohne Passwort (offen).");
              return;
            }
            // WPA2 verlangt mindestens acht Zeichen. Kuerzeres kann gar nicht
            // erst hier ankommen - der Knopf zum Speichern weist es ab -, aber
            // ein beschaedigter Flash-Inhalt koennte es. Dann lieber offen als
            // ein Netz, das niemand mehr betreten kann.
            if (laenge < 8) {
              ESP_LOGW("netz", "Gespeichertes Netz-Passwort ist zu kurz - Netz bleibt offen.");
              id(ap_passwort)[0] = '\0';
              return;
            }
            // Nur das Passwort tauschen: get_ap() bringt Netzname, Kanal und
            // die feste Adresse 192.168.4.1 unveraendert mit.
            auto ap = wifi::global_wifi_component->get_ap();
            ap.set_password(id(ap_passwort));
            wifi::global_wifi_component->set_ap(ap);
            ESP_LOGI("netz", "Eigenes Netz mit eigenem Passwort geschuetzt.");
    # Zweiter Schritt, gleiche Priorität: MQTT einrichten, bevor es startet.
    - priority: 600
      then:
        - lambda: |-
            // Kein Broker eingetragen? Dann bleibt MQTT aus. Mit
            // enable_on_boot: false startet der Client von sich aus nicht,
            // ein disable() braucht es dafuer nicht mehr.
            if (strlen(id(mqtt_broker)) == 0) {
              ESP_LOGI("mqtt", "Kein Broker eingetragen - MQTT bleibt aus.");
              return;
            }

            /* NUR die Zugangsdaten setzen - NICHT verbinden.
             *
             * Hier stand ein enable(). Das war ein Fehler mit Ansage: Der
             * Client startet im Zustand DISABLED, enable() greift also
             * wirklich und ruft sofort start_dnslookup_() samt LwIP-Sperre
             * auf. Dieser Block laeuft aber mit Prioritaet 600, das WLAN
             * richtet sich erst bei 250 ein - es gab also noch keinen
             * Netzwerkstapel, den man haette fragen koennen. Ergebnis: Das
             * Geraet blieb beim Start haengen, sobald ein Broker eingetragen
             * war. Ohne Broker fiel es nie auf, weil disable() bei bereits
             * deaktiviertem Client sofort zurueckkehrt.
             *
             * Verbunden wird weiter unten mit Prioritaet -100, wenn alle
             * Komponenten eingerichtet sind. Das ist genau der Zeitpunkt, an
             * dem setup() es sonst selbst getan haette. */
            const float port = id(mqtt_port_num).state;
            mqtt::global_mqtt_client->set_broker_address(id(mqtt_broker));
            mqtt::global_mqtt_client->set_broker_port(isnan(port) ? 1883 : (uint16_t) port);
            mqtt::global_mqtt_client->set_username(id(mqtt_user));
            mqtt::global_mqtt_client->set_password(id(mqtt_pass));
            ESP_LOGI("mqtt", "Broker %s:%d vorgemerkt", id(mqtt_broker),
                     isnan(port) ? 1883 : (int) port);
    # Ganz zum Schluss: Jetzt steht der Netzwerkstapel, jetzt darf verbunden
    # werden. Ohne eingetragenen Broker passiert nichts - der Client bleibt
    # aus, und niemand ohne MQTT merkt etwas davon.
    - priority: -100
      then:
        - lambda: |-
            /* Zuerst die Eingabefelder fuellen: Sie sollen zeigen, was
             * gespeichert ist.
             *
             * Vorher standen sie nach jedem Neustart leer, obwohl das Geraet
             * verbunden war. Das war nicht nur verwirrend, es war eine Falle:
             * Wer nur den Benutzer aendern wollte und das Brokerfeld leer
             * liess, schrieb beim Speichern einen LEEREN Broker zurueck - und
             * leer heisst "MQTT aus". Ein Klick, und die Verbindung war weg.
             *
             * Das Passwort bleibt bewusst aussen vor. Es stuende sonst im
             * Klartext im Ereignisstrom, den jeder lesen kann, der die
             * Geraeteseite erreicht. Der Speicherknopf behandelt ein leeres
             * Passwortfeld deshalb als "unveraendert". */
            id(mqtt_broker_input).publish_state(id(mqtt_broker));
            id(mqtt_user_input).publish_state(id(mqtt_user));

            if (strlen(id(mqtt_broker)) == 0) return;
            mqtt::global_mqtt_client->enable();


# --- MQTT: die Tür zu fremden Systemen --------------------------------------
#
# Level soll vorhandene Systeme ERGÄNZEN statt gegen sie anzutreten. MQTT ist
# die Schnittstelle, die das leistet: Victron Cerbo GX (Venus OS bringt einen
# eigenen Broker mit), E1NFACH E1NS, ioBroker, openHAB, Node-RED. Keines
# davon hat einen Neigungssensor - mit MQTT ist Level deren Zubehör statt
# deren Wettbewerber.
#
# DREI EINSTELLUNGEN, DIE HIER NICHT ZUFÄLLIG STEHEN:
#
# broker "0.0.0.0" ist ein PLATZHALTER. ESPHome verlangt die Adresse zur
#   Kompilierzeit, ein Produkt kann sie aber nicht kennen - der Kunde trägt
#   seine ein. Der on_boot-Block weiter oben ersetzt sie, bevor MQTT startet
#   (Priorität 600 gegen dessen AFTER_WIFI = 200), und schaltet MQTT ganz ab,
#   solange nichts eingetragen ist.
#
# reboot_timeout 0s ist KEINE Feinheit, sondern zwingend: Voreingestellt
#   startet ESPHome das Gerät neu, wenn MQTT 15 Minuten lang nicht verbindet.
#   Bei jedem Kunden ohne Broker wäre das ein Neustart alle 15 Minuten.
#
# discovery false, weil Home Assistant alles bereits über die native
#   Schnittstelle bekommt. Eingeschaltet stünde jede Entität dort DOPPELT.
#   Fremde Systeme brauchen die Erkennung nicht - sie abonnieren die Themen
#   unten direkt.
#
# THEMENAUFBAU:  camperminder/level/<art>/<name>/state
#
#   camperminder/level/sensor/hub_hinten_links/state      ->  4.5
#   camperminder/level/sensor/neigung_pitch/state         ->  -0.82
#   camperminder/level/text_sensor/anweisung/state        ->  Hinten links 4.5 cm hoch
#   camperminder/level/binary_sensor/schraeglage/state    ->  ON
#
# Die Reihenfolge <art>/<name> gibt ESPHome vor. Sie kostet nichts und hat
# einen Vorteil: Neue Entitäten erscheinen von selbst am richtigen Platz,
# statt dass jemand ein Thema von Hand nachtragen muss - und genau das
# vergisst man.
mqtt:
  broker: "0.0.0.0"
  # Der Client startet NICHT von selbst. Er wird erst eingeschaltet, wenn ein
  # Broker eingetragen ist - und erst, wenn der Netzwerkstapel steht.
  enable_on_boot: false
  topic_prefix: camperminder/level
  discovery: false
  reboot_timeout: 0s
  # Damit ein fremdes System erkennt, ob die Werte noch gelten.
  birth_message:
    topic: camperminder/level/status
    payload: online
  will_message:
    topic: camperminder/level/status
    payload: offline

web_server:
  port: 80
  include_internal: true
  # local: true bettet die Oberfläche in die Firmware ein, statt sie von einem
  # CDN nachzuladen. OHNE das bleibt die Seite auf dem Stellplatz ohne Internet
  # leer - genau dann, wenn man sie braucht. Kostet etwas Flash (4 MB sind da).
  local: true

preferences:
  flash_write_interval: 1min

# --- I2C: OLED + MPU6050 auf einem Bus -------------------------------------
i2c:
  id: grove
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true
  frequency: 100kHz          # stabil mit OLED+MPU; 400kHz möglich, wenn Bus sauber
  sda_pullup_enabled: true
  scl_pullup_enabled: true

globals:
  - id: pitch_offset
    type: float
    initial_value: "0.0"
    restore_value: true
  - id: roll_offset
    type: float
    initial_value: "0.0"
    restore_value: true

  # Vorzeichen von Quer- und Hochachse, abgeleitet aus der Einbaulage.
  #
  # BEWUSST OHNE restore_value: Der Wert hat genau eine Quelle, und das ist der
  # Select "Einbaulage". Der stellt beim Start seinen gespeicherten Zustand
  # wieder her und loest dabei on_value aus, das diesen Wert setzt. Ein zweiter
  # gespeicherter Wert koennte davon abweichen - und dann rechnete das Geraet
  # anders, als die Oberflaeche anzeigt.
  - id: z_flip
    type: float
    initial_value: "1.0"

  # Der geglättete Stand der beiden Achsen - siehe smooth_* oben.
  #
  # NAN heißt "noch nichts gesehen": Der erste Messwert wird dann unverändert
  # übernommen, statt aus einer erfundenen Null herauszulaufen. Bewusst ohne
  # restore_value - ein gespeicherter Neigungswert vom letzten Stellplatz wäre
  # nach dem Einschalten schlicht falsch.
  - id: pitch_smooth
    type: float
    initial_value: "NAN"
  - id: roll_smooth
    type: float
    initial_value: "NAN"

  # Gedächtnis der Hysterese von "steht gerade" - siehe level_release.
  - id: level_hold
    type: bool
    initial_value: "false"

  # Das selbst vergebene Passwort des geräteeigenen Netzes.
  #
  # Leer heißt offen, und das ist der Auslieferungszustand - Begründung beim
  # on_boot weiter unten. Wer eines setzt, findet es hier wieder; wer es
  # löscht, macht das Netz wieder offen.
  #
  # 63 Zeichen ist die Obergrenze von WPA2, plus Abschluss macht 64. Mit
  # restore_value, damit es Neustarts und Updates übersteht. Werkseinstellungen
  # löschen es - und das ist hier richtig und gefahrlos: Danach ist das Netz
  # offen, niemand ist ausgesperrt, und genau darum geht es.
  #
  # char-Feld und nicht std::string: restore_value speichert die Bytes des
  # Objekts, und bei std::string wäre das ein Zeiger ins Nichts.
  - id: ap_passwort
    type: char[64]
    restore_value: true

  # --- Hubhöhe je Ecke, im Gerät gerechnet ----------------------------------
  #
  # Diese fünf Werte entstehen einmal je Sekunde im interval-Block weiter
  # unten und werden von den Sensoren nur noch ausgegeben. Das ist Absicht:
  # Die Rechnung steht damit an EINER Stelle, nicht in fünf Lambdas, die
  # auseinanderlaufen können.
  #
  # Warum überhaupt im Gerät und nicht in Home Assistant: Stünde sie dort,
  # gäbe es sie nur dort - nicht auf der Geräteseite, nicht über MQTT, nicht
  # auf einem Cerbo GX. Genau das Merkmal, mit dem verkauft wird, wäre an die
  # Plattform gefesselt, von der es unabhängig sein soll.
  - id: hub_vl
    type: float
    initial_value: "0.0"
  - id: hub_vr
    type: float
    initial_value: "0.0"
  - id: hub_hl
    type: float
    initial_value: "0.0"
  - id: hub_hr
    type: float
    initial_value: "0.0"
  # Vorzeichenbehaftet: positiv heißt hoch, negativ runter. Nur das Stützrad
  # kann beides - ein Keil hebt, er senkt nicht.
  - id: stuetzrad
    type: float
    initial_value: "0.0"
  # Der nächste Handgriff als Satz. std::string ohne restore_value: Er wird
  # jede Sekunde neu gebildet, gespeichert werden müsste er nie.
  - id: anweisung
    type: std::string

  # Gedächtnis der Hysterese der Schräglagenwarnung.
  - id: schraeg_hold
    type: bool
    initial_value: "false"

  # --- Ruhelage für die Lageänderung ----------------------------------------
  #
  # Wogegen die aktuelle Neigung verglichen wird. Mit restore_value, damit ein
  # Stromausfall nicht als Diebstahl gemeldet wird.
  - id: ruhe_pitch
    type: float
    initial_value: "0.0"
    restore_value: true
  - id: ruhe_roll
    type: float
    initial_value: "0.0"
    restore_value: true
  - id: ruhe_gesetzt
    type: bool
    initial_value: "false"
    restore_value: true
  # Zähler ruhiger Sekunden - siehe interval-Block.
  - id: ruhe_takte
    type: int
    initial_value: "0"

  # --- Nullpunkt der Drehraten ----------------------------------------------
  #
  # Der Gyro eines MPU6050 zeigt im Stillstand NICHT null, sondern einen
  # Versatz von oft mehreren Grad je Sekunde - je Achse und je Bauteil
  # verschieden. Die erste Fassung addierte die Absolutwerte der drei Achsen
  # und verglich mit 3 Grad/s; damit überschritt allein der Versatz die
  # Schwelle, und "In Bewegung" klebte dauerhaft an.
  #
  # Das war nicht nur eine falsche Meldung: Die Glättung schaltet bei Bewegung
  # auf flott, also war der Regler "Anzeigeruhe" wirkungslos, und die Ruhelage
  # wurde nie nachgeführt, also meldete "Lageänderung" Daueralarm. Ein Fehler,
  # drei Symptome.
  #
  # Diese drei Werte lernen den Versatz im Betrieb. Bewusst OHNE restore_value:
  # Er wandert mit der Temperatur, ein gespeicherter Wert von gestern wäre
  # schlechter als einer, der sich in einer Minute neu einstellt.
  - id: gyro_null_x
    type: float
    initial_value: "0.0"
  - id: gyro_null_y
    type: float
    initial_value: "0.0"
  - id: gyro_null_z
    type: float
    initial_value: "0.0"
  # Ob gerade wirklich Bewegung ist - gemessen als Abweichung VOM Versatz.
  - id: bewegt_roh
    type: bool
    initial_value: "false"

  # Der Wert, der in der Anweisung steht. Mit Gedächtnis, damit der Satz nicht
  # im Sekundentakt wechselt - siehe interval-Block.
  - id: anweisung_cm
    type: float
    initial_value: "0.0"

  # --- Zugangsdaten des MQTT-Brokers ----------------------------------------
  #
  # Gespeichert, nicht einkompiliert: Ein Produkt kann die Adresse seines
  # Kunden nicht kennen. Leer heißt "kein MQTT" - dann bleibt der Client aus,
  # und niemand, der MQTT gar nicht benutzt, merkt etwas davon.
  #
  # Die Eingabefelder darunter sind die EINGABE, diese Felder der Speicher.
  # Übernommen wird erst auf Knopfdruck - sonst stünde ein halb getippter
  # Versuch im Flash und das Gerät versuchte, ihn zu erreichen.
  - id: mqtt_broker
    type: char[64]
    restore_value: true
  - id: mqtt_user
    type: char[33]
    restore_value: true
  - id: mqtt_pass
    type: char[65]
    restore_value: true

# --- Fahrzeugmaße ---------------------------------------------------------
# Gehören ins Gerät, nicht ins Handy: sie beschreiben das Fahrzeug, nicht den
# Betrachter. Lagen sie im Browser, wären sie beim Handywechsel weg und zwei
# Mitfahrer sähen verschiedene Zahlen.
#
# restore_value hält sie über Stromausfall und Neustart. optimistic, weil es
# keine Gegenstelle gibt, die den Wert bestätigen könnte - das Gerät ist die
# Gegenstelle.
#
# Die Grenzen sind bewusst weit: ein Kastenwagen hat 3000 mm Radstand, ein
# Liner über 7000. Zu enge Grenzen würden echte Fahrzeuge ausschließen.
number:
  - platform: template
    name: "Radstand"
    id: wheelbase_mm
    unit_of_measurement: mm
    icon: mdi:arrow-left-right
    entity_category: config
    min_value: 1000
    max_value: 8000
    step: 10
    initial_value: 3500
    restore_value: true
    optimistic: true
    mode: box

  - platform: template
    name: "Spurweite"
    id: track_mm
    unit_of_measurement: mm
    icon: mdi:arrow-expand-horizontal
    entity_category: config
    min_value: 800
    max_value: 2600
    step: 10
    initial_value: 1800
    restore_value: true
    optimistic: true
    mode: box

  - platform: template
    name: "Toleranz"
    id: tolerance_cm
    unit_of_measurement: cm
    icon: mdi:plus-minus-variant
    entity_category: config
    min_value: 1
    max_value: 20
    step: 0.5
    initial_value: 5
    restore_value: true
    optimistic: true
    mode: box

  # Die Toleranz des Präzisionsmodus - eine feste Gradzahl für beide Achsen
  # statt einer über die Fahrzeugmaße umgerechneten Zentimeterangabe.
  #
  # Sie ist bewusst NICHT dasselbe wie "Toleranz": Zentimeter sind das Maß der
  # Wirklichkeit (5 cm Höhenunterschied merkt man im Bett), Grad das Maß des
  # Sensors. Wer beide Achsen gleich streng bewertet haben will, arbeitet in
  # Grad - dann bedeutet dieselbe Gradzahl längs allerdings mehr Zentimeter
  # als quer, weil der Radstand größer ist als die Spurweite.
  #
  # Grenzen und Schrittweite müssen zu number.py der Integration passen.
  - platform: template
    name: "Toleranz genau"
    id: tolerance_deg
    unit_of_measurement: "°"
    icon: mdi:angle-acute
    entity_category: config
    min_value: 0.1
    max_value: 3
    step: 0.1
    initial_value: ${level_tolerance_deg}
    restore_value: true
    optimistic: true
    mode: box

  # --- Die beiden Regler für das Empfinden ---------------------------------
  #
  # Sie ändern nichts an der Messung und nichts an der Toleranz. Sie ändern,
  # wie die Anzeige sich anfühlt - und das empfindet jeder anders. Genau
  # deshalb stehen sie hier als Entität und nicht als Substitution: Sonst
  # müsste jeder, dem die Anzeige zu zappelig oder zu träge ist, die Firmware
  # neu bauen.
  - platform: template
    name: "Anzeigeruhe"
    id: anzeigeruhe
    icon: mdi:sine-wave
    entity_category: config
    min_value: 0
    max_value: 10
    step: 1
    initial_value: ${calm_default}
    restore_value: true
    optimistic: true
    # Schieber und kein Eingabefeld: Das hier ist eine Geschmacksfrage, die man
    # durch Probieren beantwortet, keine gemessene Zahl, die man einträgt.
    mode: slider

  # Prozent und kein Faktor: "125 %" liest sich als "ein Viertel über der
  # Toleranz", "1,25" muss man erst übersetzen. 100 % schaltet die Hysterese
  # ab - dann fällt die Anzeige sofort aus "eben", sobald die Toleranz auch
  # nur um ein Rauschen überschritten wird. Genau das war der Ausgangszustand,
  # den niemand haben will; deshalb ist es die untere Grenze und nicht die
  # Vorgabe.
  - platform: template
    name: "Haltebereich"
    id: haltebereich
    unit_of_measurement: "%"
    icon: mdi:arrow-expand-horizontal
    entity_category: config
    min_value: 100
    max_value: 200
    step: 5
    initial_value: ${level_release_default}
    restore_value: true
    optimistic: true
    mode: box

  # Anschluss des MQTT-Brokers. 1883 unverschlüsselt, 8883 mit TLS - die
  # Voreinstellung deckt Mosquitto und Venus OS ab.
  - platform: template
    name: "MQTT Port"
    id: mqtt_port_num
    icon: mdi:lan-connect
    entity_category: config
    min_value: 1
    max_value: 65535
    step: 1
    initial_value: 1883
    restore_value: true
    optimistic: true
    mode: box

  # Ab welcher Schräglage gewarnt wird.
  #
  # Drei Grad ist keine gegriffene Zahl: Ein Absorberkühlschrank arbeitet
  # darüber nicht mehr zuverlässig, weil das Kältemittel nicht mehr
  # zurückläuft. Das merkt niemand, bis das Essen warm ist - deshalb warnt das
  # Gerät, und deshalb hat die Warnung nichts mit der Nivellier-Toleranz zu
  # tun. Die darf jeder nach Geschmack einstellen; diese Grenze kommt aus der
  # Technik des Kühlschranks.
  - platform: template
    name: "Schräglage Grenzwert"
    id: schraeg_grenz
    state_topic: camperminder/level/number/schraeglage_grenzwert/state
    command_topic: camperminder/level/number/schraeglage_grenzwert/command
    unit_of_measurement: "°"
    icon: mdi:fridge-alert
    entity_category: config
    min_value: 1
    max_value: 10
    step: 0.5
    initial_value: 3
    restore_value: true
    optimistic: true
    mode: box

  # Ab welcher Abweichung von der Ruhelage eine Lageänderung gemeldet wird.
  #
  # Ein Grad entspricht bei 3500 mm Radstand rund 6 cm Höhenunterschied - so
  # viel bewegt sich ein Fahrzeug nicht von selbst. Wind und Einsteigen
  # bleiben darunter, Anheben und Abschleppen darüber.
  - platform: template
    name: "Lageänderung Grenzwert"
    id: lage_grenz
    state_topic: camperminder/level/number/lageaenderung_grenzwert/state
    command_topic: camperminder/level/number/lageaenderung_grenzwert/command
    unit_of_measurement: "°"
    icon: mdi:car-arrow-right
    entity_category: config
    min_value: 0.2
    max_value: 5
    step: 0.1
    initial_value: 1
    restore_value: true
    optimistic: true
    mode: box

  # 0 bedeutet: in Zentimetern rechnen statt in Stufen. Wer Hydraulik hat,
  # lässt den Wert ohnehin auf 0.
  - platform: template
    name: "Keilstufe"
    id: wedge_step_cm
    unit_of_measurement: cm
    icon: mdi:stairs
    entity_category: config
    min_value: 0
    max_value: 10
    step: 0.5
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box

# Bestimmt, wie die Geräteseite ihre Hinweise ordnet: mit Keilen eine
# Anweisung nach der anderen, mit einem Hebesystem alle Ecken auf einmal.
select:
  - platform: template
    name: "Ausrichtart"
    id: level_method
    icon: mdi:car-lifted-pickup
    entity_category: config
    options:
      - "Auffahrkeile"
      - "Hydraulik oder Luftkissen"
    initial_option: "Auffahrkeile"
    restore_value: true
    optimistic: true

  # Ändert die Geometrie, nicht nur die Beschriftung:
  #
  # Wohnmobil - vier Auflagepunkte, zwei Achsen. "Radstand" ist der
  #   Achsabstand, korrigiert wird ausschließlich nach oben.
  #
  # Wohnwagen - eine Achse plus Stützrad. Quer läuft es gleich, längs
  #   aber über das Stützrad, das sich in BEIDE Richtungen kurbeln lässt.
  #   "Radstand" bedeutet dann Abstand Achse zu Stützrad - meist deutlich
  #   größer als ein Radstand, also unbedingt nachmessen.
  - platform: template
    name: "Fahrzeugart"
    id: vehicle_type
    icon: mdi:rv-truck
    entity_category: config
    options:
      - "Wohnmobil"
      - "Wohnwagen"
    initial_option: "Wohnmobil"
    restore_value: true
    optimistic: true

  # --- Einbaulage des Gehäuses --------------------------------------------
  # Anders als Achszuordnung und Vorzeichen KEINE Substitution, sondern zur
  # Laufzeit umstellbar. Der Grund ist der Unterschied, wer die Antwort kennt:
  # Zuordnung und Vorzeichen hängen an der Bestückung und stehen mit dem Gerät
  # fest. Wie herum das Gehäuse geklebt wird, entscheidet der Nutzer erst im
  # Fahrzeug - und dafür soll er nicht flashen müssen.
  #
  # "Deckel unten" heißt: unter ein Regalbrett oder eine Decke geklebt, Pfeil
  # weiterhin nach vorn. Das ist eine Drehung um die LÄNGSachse, und die kehrt
  # Quer- und Hochachse um. Die Längsachse ist die Drehachse und bleibt, wie
  # sie ist - deshalb wirkt z_flip nur auf Roll und nicht auf Pitch.
  - platform: template
    name: "Einbaulage"
    id: mounting_orientation
    icon: mdi:rotate-3d-variant
    entity_category: config
    options:
      - "Deckel oben"
      - "Deckel unten"
    initial_option: "Deckel oben"
    restore_value: true
    optimistic: true
    on_value:
      then:
        - lambda: |-
            const float neu = (x == "Deckel unten") ? -1.0f : 1.0f;
            // Nur bei echter Änderung warnen. Beim Start stellt der Select
            // seinen gespeicherten Wert wieder her und löst on_value aus -
            // eine Warnung bei jedem Neustart wäre ein Fehlalarm, und
            // Fehlalarme liest nach der dritten Woche niemand mehr.
            if (neu != id(z_flip)) {
              id(z_flip) = neu;
              ESP_LOGW("level", "Einbaulage jetzt '%s' - Nullpunkt neu kalibrieren!", x.c_str());
            }

# --- Präzisionsmodus --------------------------------------------------------
# Die Anzeige misst in Toleranzen, nicht in Grad: Innerhalb der eingestellten
# Toleranz steht die Blase in der Mitte, weil dort nichts mehr zu tun ist. Das
# ist für den Alltag richtig und für Pedanten zu grob - wer die letzten Zehntel
# sehen will, sieht sie hier.
#
# Was der Schalter ändert:
#   - Die Toleranz ist "Toleranz genau" in Grad statt "Toleranz" in
#     Zentimetern, und sie gilt für beide Achsen gleich.
#   - Die Blase bleibt auch innerhalb der Toleranz an ihrer echten Stelle.
#   - Winkel stehen mit zwei Nachkommastellen statt mit einer.
#
# Gehört ins GERÄT und nicht nur in Home Assistant - aus demselben Grund wie
# die Einbaulage: Wer das Gerät ohne Zentrale betreibt, käme sonst an eine
# Einstellung nicht heran, die darüber entscheidet, was er sieht. Die
# Integration liest den Schalter vom Gerät, statt einen zweiten danebenzustellen.
switch:
  - platform: template
    name: "Präzisionsmodus"
    id: precise_mode
    state_topic: camperminder/level/switch/praezisionsmodus/state
    command_topic: camperminder/level/switch/praezisionsmodus/command
    icon: mdi:target
    entity_category: config
    optimistic: true
    # Übersteht den Neustart und startet im Zweifel aus - eine
    # Verhaltenserweiterung soll niemanden überraschen, der das Gerät gerade
    # erst auspackt.
    restore_mode: RESTORE_DEFAULT_OFF

# --- Schriften fürs OLED (lädt sich beim Kompilieren automatisch) --------
font:
  # Zwei Größen, weil das Feld nur 72 x 40 Pixel hat: Die Adresse muss lesbar
  # sein, der Rest darf klein bleiben. "192.168.100.123" wäre in Größe 10 zu
  # breit - deshalb steht die Adresse in 10 und alles andere in 8.
  - file: "gfonts://Roboto"
    id: font_zeile
    size: 10
  - file: "gfonts://Roboto"
    id: font_klein
    size: 8

sensor:
  - platform: wifi_signal
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Laufzeit"
    update_interval: 60s
    entity_category: diagnostic

  # --- MPU6050: schnelle Rohwerte ------------------------------------------
  - platform: mpu6050
    i2c_id: grove
    address: 0x68
    update_interval: 100ms          # 10 Hz Rohdaten
    accel_x:
      id: accel_x
      internal: true
    accel_y:
      id: accel_y
      internal: true
    accel_z:
      id: accel_z
      internal: true
    temperature:
      name: "MPU6050 Temperatur"
      entity_category: diagnostic
      accuracy_decimals: 2
      # Nicht mehr internal: Ohne diesen Wert in Home Assistant lässt sich der
      # Nullpunktdrift des Sensors über Temperatur nicht messen - und genau der
      # begrenzt die Genauigkeit eines Neigungsmessers, nicht das Rauschen.
      #
      # throttle_average mittelt die 600 Messungen einer Minute zu einem Wert.
      # Ungebremst kämen bei 100 ms Takt zehn Werte je Sekunde in der Datenbank
      # an - für eine Temperatur sinnlos und für die Aufzeichnung eine Last.
      filters:
        - throttle_average: 60s
    gyro_x:
      name: "MPU6050 Gyro X"
      id: gyro_x
      internal: true
    gyro_y:
      name: "MPU6050 Gyro Y"
      id: gyro_y
      internal: true
    gyro_z:
      name: "MPU6050 Gyro Z"
      id: gyro_z
      internal: true

  # --- Neigung Längs (Pitch) ----------------------------------------------
  - platform: template
    name: "Neigung Pitch"
    id: pitch
    icon: mdi:caravan
    unit_of_measurement: "°"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 100ms          # live
    lambda: |-
      if (isnan(id(accel_${axis_pitch}).state) || isnan(id(accel_${axis_roll}).state) || isnan(id(accel_z).state)) {
        return NAN;
      }
      // Längs-Neigung liegt auf accel_${axis_pitch} (siehe axis_pitch oben)
      const float raw = atan2f(
        id(accel_${axis_pitch}).state,
        sqrtf(powf(id(accel_${axis_roll}).state, 2) + powf(id(accel_z).state, 2))
      ) * (180.0f / 3.14159265358979323846f);
      return (raw - id(pitch_offset)) * ${pitch_sign};
    filters:
      # Median statt Mittelwert: Ein einzelner Ausreißer wird verworfen statt
      # anteilig weitergereicht. Ein gemittelter Ausreißer wandert sonst in
      # die Glättung darunter und wird dort als "echte Bewegung" gelesen.
      - median:
          window_size: 5
          send_every: 1
      - lambda: |-
          // Adaptive Glättung - Begründung und Abbildung stehen bei den
          // substitutions calm_* am Dateianfang. Muss für Pitch und Roll
          // wortgleich bleiben, sonst verhalten sich die beiden Achsen in der
          // Anzeige unterschiedlich.
          if (isnan(x)) { id(pitch_smooth) = NAN; return x; }
          if (isnan(id(pitch_smooth))) { id(pitch_smooth) = x; return x; }

          // Der Regler wird bei jeder Messung gelesen: Eine Änderung wirkt
          // sofort, ohne Neustart - nur so kann man sie im Fahrzeug
          // ausprobieren, und dafür ist sie da.
          const float ruhe = isnan(id(anzeigeruhe).state)
            ? ${calm_default} : id(anzeigeruhe).state;
          const float rausch   = ${calm_noise_base} + ruhe * ${calm_noise_step};
          const float bewegung = rausch * ${calm_move_faktor};
          const float a_traege = 1.0f / (1.0f + ${calm_slow_faktor} * ruhe * ruhe);
          const float a_flott  = ${calm_fast_base} - ruhe * ${calm_fast_step};

          /* Allein der Abstand zum geglaetteten Wert entscheidet.
           *
           * Hier stand zusaetzlich "wenn in_motion, dann flott". Das hat den
           * Regler ausgehebelt: Wer im Fahrzeug sitzt, haelt den
           * Bewegungssensor an, und dann galt die Anzeigeruhe nicht mehr.
           * Gebraucht wird die Abkuerzung nicht - rollt das Fahrzeug, waechst
           * der Abstand binnen Zehntelsekunden ueber die Rauschgrenze und die
           * Glaettung folgt von selbst flott. */
          const float abstand = fabsf(x - id(pitch_smooth));
          float alpha = a_traege;
          if (abstand > rausch) {
            // bewegung > rausch ist durch calm_move_faktor > 1 gesichert -
            // hier kann nicht durch null geteilt werden.
            const float anteil = (abstand - rausch) / (bewegung - rausch);
            alpha += (a_flott - a_traege) * (anteil > 1.0f ? 1.0f : anteil);
          }
          id(pitch_smooth) += alpha * (x - id(pitch_smooth));
          return id(pitch_smooth);
      # Nur melden, was sich wirklich geändert hat. 0,02° sind über 3500 mm
      # Radstand gut ein Millimeter - feiner braucht es niemand, und im Stand
      # hört der Datenstrom damit schlicht auf. Genau das ist der Punkt: Die
      # Karte zeichnet dann nicht mehr zehnmal je Sekunde eine Zahl neu, die
      # sich nur im Rauschen unterscheidet.
      #
      # Der Herzschlag daneben hält den Wert trotzdem frisch - für den
      # Verlaufsgraphen in Home Assistant und für die Driftmessung weiter
      # unten, die je Minute mittelt.
      - or:
          - delta: 0.02
          - heartbeat: 30s

  # --- Neigung Quer (Roll) -------------------------------------------------
  - platform: template
    name: "Neigung Roll"
    id: roll
    icon: mdi:axis-x-rotate-clockwise
    unit_of_measurement: "°"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 100ms
    lambda: |-
      if (isnan(id(accel_${axis_roll}).state) || isnan(id(accel_z).state)) {
        return NAN;
      }
      // Quer-Neigung liegt auf accel_${axis_roll} (siehe axis_roll oben)
      //
      // z_flip kommt aus dem Select "Einbaulage" und ist -1, wenn das Gehäuse
      // kopfüber klebt. OHNE diese Korrektur liefert atan2f in Ruhe nicht 0,
      // sondern 180 Grad. Das fällt niemandem auf, weil die Kalibrierung die
      // 180 brav als Offset wegspeichert und die Anzeige danach richtig
      // aussieht - sie sitzt dann aber genau auf dem Sprung, an dem atan2f
      // zwischen +180 und -180 umklappt, und kippt bei der kleinsten Bewegung
      // zwischen zwei Extremwerten hin und her.
      const float raw = atan2f(
        -id(accel_${axis_roll}).state * id(z_flip),
        id(accel_z).state * id(z_flip)
      ) * (180.0f / 3.14159265358979323846f);
      return (raw - id(roll_offset)) * ${roll_sign};
    filters:
      # Wortgleich zum Pitch-Sensor oben - siehe die Begründung dort.
      - median:
          window_size: 5
          send_every: 1
      - lambda: |-
          if (isnan(x)) { id(roll_smooth) = NAN; return x; }
          if (isnan(id(roll_smooth))) { id(roll_smooth) = x; return x; }

          const float ruhe = isnan(id(anzeigeruhe).state)
            ? ${calm_default} : id(anzeigeruhe).state;
          const float rausch   = ${calm_noise_base} + ruhe * ${calm_noise_step};
          const float bewegung = rausch * ${calm_move_faktor};
          const float a_traege = 1.0f / (1.0f + ${calm_slow_faktor} * ruhe * ruhe);
          const float a_flott  = ${calm_fast_base} - ruhe * ${calm_fast_step};

          /* Allein der Abstand zum geglaetteten Wert entscheidet.
           *
           * Hier stand zusaetzlich "wenn in_motion, dann flott". Das hat den
           * Regler ausgehebelt: Wer im Fahrzeug sitzt, haelt den
           * Bewegungssensor an, und dann galt die Anzeigeruhe nicht mehr.
           * Gebraucht wird die Abkuerzung nicht - rollt das Fahrzeug, waechst
           * der Abstand binnen Zehntelsekunden ueber die Rauschgrenze und die
           * Glaettung folgt von selbst flott. */
          const float abstand = fabsf(x - id(roll_smooth));
          float alpha = a_traege;
          if (abstand > rausch) {
            const float anteil = (abstand - rausch) / (bewegung - rausch);
            alpha += (a_flott - a_traege) * (anteil > 1.0f ? 1.0f : anteil);
          }
          id(roll_smooth) += alpha * (x - id(roll_smooth));
          return id(roll_smooth);
      - or:
          - delta: 0.02
          - heartbeat: 30s

  # --- Diagnose: Nullpunktdrift über Temperatur ----------------------------
  #
  # Wozu das dient: Ein Grad Neigung entspricht rund 17 Milli-g. Was einen
  # Neigungsmesser begrenzt, ist deshalb nicht das Rauschen, sondern das
  # Wandern des Nullpunkts mit der Temperatur - und der Innenraum eines
  # Wohnmobils schwankt zwischen Winternacht und Sommermittag um 40 bis 50
  # Grad. Wandert der Nullpunkt dabei spürbar, stimmt die Kalibrierung vom
  # Frühjahr im August nicht mehr.
  #
  # Warum eigene Werte statt der vorhandenen: Die Live-Werte oben tragen
  # accuracy_decimals 1. Ein Drift von wenigen Hundertstelgrad ist darin
  # unsichtbar. Diese Kopien führen drei Nachkommastellen und mitteln
  # zusätzlich je Minute.
  #
  # Die Rauschunterdrückung leistet inzwischen die adaptive Glättung oben: Im
  # Stand entspricht sie einem Mittel über rund hundert Messungen, drückt das
  # Rauschen also um etwa den Faktor zehn. Sie verschiebt den Mittelwert nicht,
  # und der ist hier die gesuchte Größe - ein exponentieller Mittelwert hat
  # keinen toten Bereich, er läuft jeder echten Verschiebung vollständig nach.
  # Der Herzschlag im Filter oben sorgt dafür, dass hier auch im völligen
  # Stillstand je Minute Werte ankommen und die Reihe keine Lücken bekommt.
  #
  # Auswertung siehe docs/drift_messung.md.
  - platform: copy
    source_id: pitch
    name: "Diagnose Pitch Mittel"
    entity_category: diagnostic
    unit_of_measurement: "°"
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - throttle_average: 60s

  - platform: copy
    source_id: roll
    name: "Diagnose Roll Mittel"
    entity_category: diagnostic
    unit_of_measurement: "°"
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - throttle_average: 60s

  # --- Hubhöhe je Ecke ------------------------------------------------------
  #
  # Sie geben nur aus, was der interval-Block gerechnet hat. Beim Wohnwagen
  # bedeuten "hinten links/rechts" die beiden Räder der einen Achse, und
  # "vorne" bleibt leer - dort steht das Stützrad.
  #
  # delta 0.05: Ein halber Millimeter Änderung muss niemanden erreichen.
  - platform: template
    name: "Hub vorne links"
    id: hub_vorne_links
    unit_of_measurement: cm
    icon: mdi:arrow-up-bold-box-outline
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 1s
    lambda: 'return id(hub_vl);'
    filters: [ or: [ delta: 0.05, heartbeat: 60s ] ]

  - platform: template
    name: "Hub vorne rechts"
    id: hub_vorne_rechts
    unit_of_measurement: cm
    icon: mdi:arrow-up-bold-box-outline
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 1s
    lambda: 'return id(hub_vr);'
    filters: [ or: [ delta: 0.05, heartbeat: 60s ] ]

  - platform: template
    name: "Hub hinten links"
    id: hub_hinten_links
    unit_of_measurement: cm
    icon: mdi:arrow-up-bold-box-outline
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 1s
    lambda: 'return id(hub_hl);'
    filters: [ or: [ delta: 0.05, heartbeat: 60s ] ]

  - platform: template
    name: "Hub hinten rechts"
    id: hub_hinten_rechts
    unit_of_measurement: cm
    icon: mdi:arrow-up-bold-box-outline
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 1s
    lambda: 'return id(hub_hr);'
    filters: [ or: [ delta: 0.05, heartbeat: 60s ] ]

  # Vorzeichenbehaftet, weil das Stützrad als einziger Punkt auch nach unten
  # kann: positiv heißt hoch, negativ runter. Beim Wohnmobil immer 0.
  - platform: template
    name: "Stützrad"
    id: stuetzrad_cm
    state_topic: camperminder/level/sensor/stuetzrad/state
    unit_of_measurement: cm
    icon: mdi:tow-truck
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 1s
    lambda: 'return id(stuetzrad);'
    filters: [ or: [ delta: 0.05, heartbeat: 60s ] ]

  # Der Betrag des Beschleunigungsvektors. Er muss im Stillstand immer 9,81
  # betragen, ganz gleich wie das Fahrzeug steht - die Erdbeschleunigung ändert
  # sich nicht mit der Neigung. Jede Abweichung, die mit der Temperatur
  # mitwandert, ist deshalb eindeutig ein Sensorfehler und kann nicht vom
  # Fahrzeug kommen. Das ist der einzige Wert der Messreihe, den weder
  # Reifendruck noch Federung noch ein Umparken verfälschen können.
  - platform: template
    name: "Diagnose Betrag"
    id: accel_magnitude
    entity_category: diagnostic
    unit_of_measurement: "m/s²"
    state_class: measurement
    accuracy_decimals: 4
    update_interval: 100ms
    lambda: |-
      if (isnan(id(accel_x).state) || isnan(id(accel_y).state) || isnan(id(accel_z).state)) {
        return NAN;
      }
      return sqrtf(
        powf(id(accel_x).state, 2) +
        powf(id(accel_y).state, 2) +
        powf(id(accel_z).state, 2)
      );
    filters:
      - throttle_average: 60s

# ============================================================================
#  Hubhöhe je Ecke, Anweisung und Ruhelage - die eigentliche Denkarbeit
# ----------------------------------------------------------------------------
#  Einmal je Sekunde, an EINER Stelle. Die Sensoren darunter geben nur noch
#  aus, was hier entsteht.
#
#  Eine Sekunde reicht: Das sind abgeleitete Größen, keine Messwerte. Wer
#  auffährt, sieht die Blase in Echtzeit; die Zentimeterangabe eine Sekunde
#  später ist immer noch schneller, als er den Keil zurechtlegen kann.
# ============================================================================
interval:
  # --- Bewegung: Abweichung vom eigenen Nullpunkt ----------------------------
  #
  # 100 ms, weil der Gyro in diesem Takt liefert und eine Erschütterung kurz
  # ist. Der Nullpunkt wird dabei ständig mitgelernt (Zeitkonstante rund 20 s),
  # aber langsamer, während Bewegung erkannt ist - sonst lernte er die
  # Bewegung selbst als neuen Nullpunkt und die Erkennung würde blind.
  - interval: 100ms
    then:
      - lambda: |-
          const float gx = id(gyro_x).state;
          const float gy = id(gyro_y).state;
          const float gz = id(gyro_z).state;
          if (isnan(gx) || isnan(gy) || isnan(gz)) return;

          const float tempo = id(bewegt_roh) ? 0.0005f : 0.005f;
          id(gyro_null_x) += tempo * (gx - id(gyro_null_x));
          id(gyro_null_y) += tempo * (gy - id(gyro_null_y));
          id(gyro_null_z) += tempo * (gz - id(gyro_null_z));

          const float ab = fabsf(gx - id(gyro_null_x))
                         + fabsf(gy - id(gyro_null_y))
                         + fabsf(gz - id(gyro_null_z));
          id(bewegt_roh) = ab > ${motion_deg_s};

  - interval: 1s
    then:
      - lambda: |-
          const float p_roh = id(pitch).state;
          const float r_roh = id(roll).state;
          if (isnan(p_roh) || isnan(r_roh)) {
            id(anweisung) = "Kein Messwert";
            return;
          }

          const float radstand = id(wheelbase_mm).state;
          const float spur     = id(track_mm).state;
          const float grad     = id(tolerance_deg).state;
          const float zentimeter = id(tolerance_cm).state;
          if (isnan(radstand) || isnan(spur) || isnan(grad) || isnan(zentimeter)) return;

          // Toleranz je Achse - MUSS zum Binärsensor "Camper steht gerade"
          // und zu _tolerance() in coordinator.py passen.
          const bool genau = id(precise_mode).state;
          const float tol_p = genau ? grad
            : fmaxf(atanf(zentimeter * 10.0f / radstand) * 180.0f / M_PI, 0.05f);
          const float tol_r = genau ? grad
            : fmaxf(atanf(zentimeter * 10.0f / spur) * 180.0f / M_PI, 0.05f);

          // Eine Achse innerhalb ihrer Toleranz ist FERTIG - ihr Restwinkel
          // darf die Anweisung nicht mehr formen. Ohne das nennt die Anweisung
          // eine Richtung, die die Anzeige daneben bereits als erledigt
          // ausweist.
          const float p = fabsf(p_roh) <= tol_p ? 0.0f : p_roh;
          const float r = fabsf(r_roh) <= tol_r ? 0.0f : r_roh;

          const float BOGEN = 3.14159265358979323846f / 180.0f;
          const bool wohnwagen = (id(vehicle_type).current_option() == "Wohnwagen");

          if (wohnwagen) {
            /* Zwei Räder auf einer Achse plus Stützrad.
             *
             * Quer wie beim Wohnmobil über die Spurweite - ein Keil unter das
             * tiefere Rad. Längs dagegen über das Stützrad, und das kurbelt
             * in BEIDE Richtungen; "nur anheben" wäre hier eine künstliche
             * Einschränkung. Deshalb bewusst nicht über die Vier-Ecken-
             * Rechnung, die das höchste Rad als Bezug nimmt.
             */
            id(hub_vl) = 0.0f;
            id(hub_vr) = 0.0f;
            const float quer = roundf(spur * tanf(fabsf(r) * BOGEN)) / 10.0f;
            id(hub_hl) = (r > 0.0f) ? quer : 0.0f;   // roll > 0 = rechts höher
            id(hub_hr) = (r > 0.0f) ? 0.0f : quer;
            const float laengs = roundf(radstand * tanf(fabsf(p) * BOGEN)) / 10.0f;
            id(stuetzrad) = (p > 0.0f) ? -laengs : laengs;  // pitch > 0 = Front höher
          } else {
            /* Vier Auflagepunkte. Bezug ist das höchste Rad: Es bleibt
             * stehen, alle anderen steigen. Anders herum ginge es nicht -
             * absenken kann weder ein Keil noch eine Stütze. */
            const float halb_l = radstand * tanf(p * BOGEN) / 20.0f;
            const float halb_q = spur * tanf(r * BOGEN) / 20.0f;
            float boden[4] = { +halb_l - halb_q, +halb_l + halb_q,
                               -halb_l - halb_q, -halb_l + halb_q };
            float hoechster = boden[0];
            for (int i = 1; i < 4; i++) if (boden[i] > hoechster) hoechster = boden[i];
            id(hub_vl) = roundf((hoechster - boden[0]) * 10.0f) / 10.0f;
            id(hub_vr) = roundf((hoechster - boden[1]) * 10.0f) / 10.0f;
            id(hub_hl) = roundf((hoechster - boden[2]) * 10.0f) / 10.0f;
            id(hub_hr) = roundf((hoechster - boden[3]) * 10.0f) / 10.0f;
            id(stuetzrad) = 0.0f;
          }

          /* --- Der nächste Handgriff als Satz ---------------------------
           *
           * Unter einem Zentimeter wird nichts genannt: So fein lässt sich
           * weder ein Keil legen noch eine Stütze stellen, und eine Anweisung,
           * die niemand ausführen kann, ist keine.
           */
          /* Der Satz rastet auf halbe Zentimeter, die ANZEIGE nicht.
           *
           * Das ist kein Widerspruch, sondern die Trennung, die vorher fehlte:
           * Die Anzeige soll jede Regung zeigen dürfen, ein Handgriff nicht.
           * Feiner als einen halben Zentimeter legt niemand einen Keil, und
           * ein Satz, der sich im Sekundentakt um ein Zehntel ändert, ist
           * keine Anweisung - er ist Unruhe.
           *
           * Dazu Hysterese von 0,3 cm: Ohne sie kippt der gerundete Wert
           * genau auf der Viertelgrenze hin und her.
           */
          auto ruhig = [](float neu, float alt) {
            return fabsf(neu - alt) >= 0.3f ? roundf(neu * 2.0f) / 2.0f : alt;
          };

          char text[160];
          if (wohnwagen) {
            // Reihenfolge ist Absicht: erst quer, dann längs. Das Auffahren
            // kippt den Wagen längs mit - eine vorher berechnete
            // Stützradhöhe wäre danach falsch.
            if (id(hub_hl) >= 1.0f) {
              id(anweisung_cm) = ruhig(id(hub_hl), id(anweisung_cm));
              snprintf(text, sizeof(text), "Linkes Rad %.1f cm hoch", id(anweisung_cm));
            } else if (id(hub_hr) >= 1.0f) {
              id(anweisung_cm) = ruhig(id(hub_hr), id(anweisung_cm));
              snprintf(text, sizeof(text), "Rechtes Rad %.1f cm hoch", id(anweisung_cm));
            } else if (fabsf(id(stuetzrad)) >= 1.0f) {
              id(anweisung_cm) = ruhig(fabsf(id(stuetzrad)), id(anweisung_cm));
              snprintf(text, sizeof(text), "Stützrad %.1f cm %s",
                       id(anweisung_cm), id(stuetzrad) > 0.0f ? "hoch" : "runter");
            } else {
              snprintf(text, sizeof(text), "Steht eben - fertig");
            }
          } else {
            const char *namen[4] = { "Vorne links", "Vorne rechts",
                                     "Hinten links", "Hinten rechts" };
            float werte[4] = { id(hub_vl), id(hub_vr), id(hub_hl), id(hub_hr) };
            int groesster = 0, offen = 0;
            for (int i = 0; i < 4; i++) {
              if (werte[i] > werte[groesster]) groesster = i;
              if (werte[i] >= 1.0f) offen++;
            }
            if (offen == 0) {
              snprintf(text, sizeof(text), "Steht eben - fertig");
            } else if (id(level_method).current_option() == "Auffahrkeile" || offen == 1) {
              // Mit Keilen eine Anweisung nach der anderen: Zwischen zwei
              // Versuchen muss das Fahrzeug bewegt werden, eine Liste aller
              // vier Räder wäre hier nicht hilfreich, sondern verwirrend.
              id(anweisung_cm) = ruhig(werte[groesster], id(anweisung_cm));
              snprintf(text, sizeof(text), "%s %.1f cm hoch",
                       namen[groesster], id(anweisung_cm));
            } else {
              // Mit Hydraulik geht jede Ecke einzeln und gleichzeitig.
              id(anweisung_cm) = ruhig(werte[groesster], id(anweisung_cm));
              snprintf(text, sizeof(text), "%s %.1f cm hoch, dazu %d weitere Ecke%s",
                       namen[groesster], id(anweisung_cm), offen - 1,
                       offen - 1 == 1 ? "" : "n");
            }
          }
          id(anweisung) = text;

          /* --- Ruhelage nachführen --------------------------------------
           *
           * Bezugspunkt für die Lageänderung. Er wandert bewusst mit, solange
           * das Fahrzeug ruhig steht und sich nur wenig bewegt - sonst würde
           * der Temperaturdrift des Sensors über Tage zum Alarm.
           *
           * Und er wird nach fünf ruhigen Minuten AUCH DANN übernommen, wenn
           * die Abweichung groß war: Wer umgeparkt und neu ausgerichtet hat,
           * soll keinen Daueralarm bekommen. Ein Alarm, den man nicht
           * loswird, wird abgeschaltet - und dann schützt er nie wieder.
           */
          const float lage_g = id(lage_grenz).state;
          if (isnan(lage_g)) return;

          if (!id(ruhe_gesetzt)) {
            id(ruhe_pitch) = p_roh;
            id(ruhe_roll)  = r_roh;
            id(ruhe_gesetzt) = true;
            id(ruhe_takte) = 0;
            return;
          }

          const bool bewegt = id(in_motion).has_state() && id(in_motion).state;
          const float weg = fmaxf(fabsf(p_roh - id(ruhe_pitch)),
                                  fabsf(r_roh - id(ruhe_roll)));
          if (bewegt) {
            id(ruhe_takte) = 0;
          } else {
            if (id(ruhe_takte) < 100000) id(ruhe_takte)++;
            if (weg < lage_g && id(ruhe_takte) >= 30) {
              id(ruhe_pitch) = p_roh;
              id(ruhe_roll)  = r_roh;
            }
            if (id(ruhe_takte) >= 300) {
              id(ruhe_pitch) = p_roh;
              id(ruhe_roll)  = r_roh;
              id(ruhe_takte) = 0;
            }
          }

binary_sensor:
  # id, weil die OLED-Anzeige daran abliest, ob eine Zentrale mithört. Ohne
  # Home Assistant bleibt der Wert dauerhaft aus - das ist kein Fehler,
  # sondern der Handbetrieb.
  - platform: status
    name: "Status"
    id: zentrale_verbunden

  # Dieselbe Rechnung wie die Oberfläche, nicht mehr eine eigene.
  #
  # Vorher stand hier eine feste Gradzahl. Bei 5 cm Toleranz meldete dieser
  # Sensor deshalb "nicht gerade", während die Geräteseite daneben "EBEN -
  # STOP" zeigte - zwei Antworten auf dieselbe Frage, und keine davon war
  # erkennbar die maßgebliche. Wer diesen Sensor in einer Automation benutzt,
  # bekommt jetzt genau das, was er auf dem Handy sieht.
  - platform: template
    name: "Camper steht gerade"
    id: camper_level_ok
    icon: mdi:axis-arrow
    lambda: |-
      if (isnan(id(pitch).state) || isnan(id(roll).state)) {
        id(level_hold) = false;
        return {};
      }

      // Im Präzisionsmodus eine feste Gradzahl für beide Achsen, sonst die
      // Zentimeterangabe über das jeweilige Fahrzeugmaß umgerechnet - so ist
      // längs und quer gleich streng bewertet. MUSS zu tolerance() in
      // webui.js und _tolerance() in coordinator.py passen.
      const bool genau = id(precise_mode).state;
      const float grad = id(tolerance_deg).state;
      const float zentimeter = id(tolerance_cm).state;
      const float laengs = id(wheelbase_mm).state;
      const float quer = id(track_mm).state;
      const float halten = id(haltebereich).state;
      // Beim Start kann ein Einstellwert noch fehlen. Dann lieber "unbekannt"
      // melden als "steht nicht gerade" - ein falsches Nein ist hier so
      // schlecht wie ein falsches Ja.
      if (isnan(grad) || isnan(zentimeter) || isnan(laengs) || isnan(quer)
          || isnan(halten)) {
        return {};
      }

      const float tol_pitch = genau ? grad
        : fmaxf(atanf(zentimeter * 10.0f / laengs) * 180.0f / M_PI, 0.05f);
      const float tol_roll = genau ? grad
        : fmaxf(atanf(zentimeter * 10.0f / quer) * 180.0f / M_PI, 0.05f);

      // Hysterese: Wer einmal drinsteht, bleibt drin, bis die Neigung über den
      // Haltebereich hinausgeht. Auch der ist ein Regler - siehe dort.
      const float faktor = id(level_hold) ? halten / 100.0f : 1.0f;
      id(level_hold) = fabsf(id(pitch).state) <= tol_pitch * faktor
        && fabsf(id(roll).state) <= tol_roll * faktor;
      return id(level_hold);

  # --- Schräglagenwarnung ---------------------------------------------------
  #
  # Nicht dasselbe wie "steht gerade": Jene Frage entscheidet der Nutzer über
  # seine Toleranz, diese entscheidet die Technik des Kühlschranks. Wer 8 cm
  # Toleranz einstellt, weil ihm das zum Schlafen reicht, soll trotzdem
  # erfahren, wenn sein Absorber aussteigt.
  #
  # Hysterese von 20 %: Ohne sie flattert die Meldung genau an der Grenze -
  # und eine Warnung, die im Minutentakt kommt und geht, schaltet man ab.
  - platform: template
    name: "Schräglage"
    id: schraeglage
    state_topic: camperminder/level/binary_sensor/schraeglage/state
    device_class: problem
    icon: mdi:fridge-alert
    lambda: |-
      if (isnan(id(pitch).state) || isnan(id(roll).state)) return {};
      const float grenze = id(schraeg_grenz).state;
      if (isnan(grenze)) return {};
      const float ab = fmaxf(fabsf(id(pitch).state), fabsf(id(roll).state));
      id(schraeg_hold) = id(schraeg_hold) ? (ab > grenze * 0.8f) : (ab > grenze);
      return id(schraeg_hold);

  # --- Lageänderung ---------------------------------------------------------
  #
  # Der Unterschied zu "In Bewegung" ist der ganze Punkt: Jenes meldet eine
  # ERSCHÜTTERUNG - jemand steigt ein, Wind, der Nachbar rangiert. Das ist
  # Anwesenheit, kein Alarm. Dieses hier meldet, dass das Fahrzeug seine LAGE
  # verlassen hat und nicht zurückgekommen ist: angehoben, abgeschleppt,
  # weggefahren.
  #
  # Nur das zweite ist ein Alarm. Getrennt herausgegeben, damit der Kunde
  # selbst entscheidet, worauf er eine Meldung legt.
  - platform: template
    name: "Lageänderung"
    id: lageaenderung
    state_topic: camperminder/level/binary_sensor/lageaenderung/state
    device_class: problem
    icon: mdi:car-arrow-right
    lambda: |-
      if (!id(ruhe_gesetzt)) return {};
      if (isnan(id(pitch).state) || isnan(id(roll).state)) return {};
      const float grenze = id(lage_grenz).state;
      if (isnan(grenze)) return {};
      const float weg = fmaxf(fabsf(id(pitch).state - id(ruhe_pitch)),
                              fabsf(id(roll).state - id(ruhe_roll)));
      return weg >= grenze;

  # Erschütterung: jemand steigt ein, Wind, der Nachbar rangiert.
  #
  # KEIN Alarm - das ist Anwesenheit. Der Alarm ist "Lageänderung" darüber.
  #
  # Die Entscheidung fällt im 100-ms-Block weiter oben, weil sie den gelernten
  # Nullpunkt der Drehraten braucht. Hier stand vorher die Summe der
  # ABSOLUTWERTE gegen 3 Grad/s - und weil ein MPU6050 im Stillstand einen
  # Versatz von mehreren Grad je Sekunde zeigt, war die Meldung dauerhaft an.
  - platform: template
    name: "In Bewegung"
    id: in_motion
    device_class: moving
    lambda: 'return id(bewegt_roh);'
    filters:
      - delayed_off: 20s   # gilt erst 20 s nach der letzten Bewegung als "steht"

text_sensor:
  # Unsere eigene Fassung, nicht die von ESPHome. Muss mit der Version in
  # esphome.project und im Update-Manifest übereinstimmen: Die Update-
  # Prüfung vergleicht genau diese Zeichenkette.
  - platform: template
    name: "Firmware Version"
    id: firmware_version_sensor
    icon: mdi:tag-outline
    entity_category: diagnostic
    lambda: 'return {"${firmware_version}"};'
    # 60s und nicht länger: Ein Template-Sensor veröffentlicht erst NACH
    # Ablauf des ersten Intervalls, nicht beim Start. Mit 6h stand hier
    # stundenlang "unbekannt" und die Zeile fehlte in der Technik-Liste.
    update_interval: 60s

  # Der nächste Handgriff als Satz - "Hinten links 4,5 cm hoch".
  #
  # Das ist der Unterschied zwischen einer Wasserwaage und einer Hilfe: Eine
  # Wasserwaage zeigt zwei Winkel und überlässt den Rest dem Kopfrechnen.
  # Diese Zeile sagt, was zu tun ist - und sie sagt es überall, wo das Gerät
  # gelesen wird: auf der Geräteseite, in Home Assistant, später über MQTT auf
  # einem Cerbo GX.
  - platform: template
    name: "Anweisung"
    id: anweisung_text
    icon: mdi:hand-pointing-right
    lambda: 'return {id(anweisung)};'
    update_interval: 1s
    filters:
      # Nur weitergeben, was sich geändert hat: Sonst stünde derselbe Satz
      # sekündlich in der Datenbank.
      - lambda: |-
          static std::string letzter;
          if (x == letzter) return {};
          letzter = x;
          return x;

  # Zustand der MQTT-Verbindung im Klartext - die erste Frage bei jedem
  # Anbindungsversuch lautet "ist er überhaupt dran?".
  #
  # Das Passwort steht hier bewusst nicht, die Adresse schon: Sie ist keine
  # Geheimnis, und ohne sie lässt sich ein Tippfehler nicht finden.
  - platform: template
    name: "MQTT"
    id: mqtt_status
    icon: mdi:transit-connection-variant
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (strlen(id(mqtt_broker)) == 0) return {"aus"};
      if (mqtt::global_mqtt_client->is_connected())
        return {std::string("verbunden mit ") + id(mqtt_broker)};
      return {std::string("keine Verbindung zu ") + id(mqtt_broker)};

  # Ob das eigene Netz geschützt ist - NICHT womit.
  #
  # Der Zustand ist die nützliche Auskunft: "Steht mein Gerät offen?" lässt
  # sich damit beantworten, ohne das Passwort des Nutzers irgendwo anzuzeigen.
  # Wer es vergessen hat, setzt ein neues; wer gar keines mehr will, löscht es.
  - platform: template
    name: "Eigenes Netz"
    id: netz_schutz
    icon: mdi:wifi-lock
    entity_category: diagnostic
    lambda: |-
      return {strlen(id(ap_passwort)) >= 8 ? "mit Passwort" : "offen"};
    update_interval: 60s

  - platform: wifi_info
    ip_address:
      name: "IP Adresse"
      id: ip_adresse
      entity_category: diagnostic
    ssid:
      name: "Verbundenes WLAN"
      id: wlan_name
      entity_category: diagnostic
    mac_address:
      name: "WLAN MAC"
      entity_category: diagnostic

text:
  # Eingabefeld für ein selbst vergebenes Passwort des eigenen Netzes.
  #
  # Es liegt hier und nicht in der Gerätedatei, weil die Funktion zum Produkt
  # gehört: Wer hardware.yaml als Paket einbindet, soll sie mitbekommen.
  #
  # optimistic, weil es keine Gegenstelle gibt - das Gerät ist die Gegenstelle.
  # Ohne restore_value: Das Feld ist die EINGABE, gespeichert wird erst beim
  # Druck auf den Knopf. Sonst stünde ein halb getippter Versuch im Flash.
  - platform: template
    name: "Netz Passwort neu"
    id: ap_pass_input
    icon: mdi:form-textbox-password
    entity_category: config
    mode: password
    min_length: 0
    max_length: 63
    optimistic: true

  # --- Eingabefelder für den MQTT-Broker ------------------------------------
  # Adresse leer lassen und speichern schaltet MQTT wieder ab.
  - platform: template
    name: "MQTT Broker"
    id: mqtt_broker_input
    icon: mdi:server-network
    entity_category: config
    mode: text
    min_length: 0
    max_length: 63
    optimistic: true

  - platform: template
    name: "MQTT Benutzer"
    id: mqtt_user_input
    icon: mdi:account
    entity_category: config
    mode: text
    min_length: 0
    max_length: 32
    optimistic: true

  - platform: template
    name: "MQTT Passwort"
    id: mqtt_pass_input
    icon: mdi:form-textbox-password
    entity_category: config
    mode: password
    min_length: 0
    max_length: 64
    optimistic: true

button:
  # Übernimmt, was im Feld darüber steht. Leer bedeutet: Netz wieder öffnen.
  #
  # Neustart danach, weil ein laufendes Netz sein Passwort nicht wechseln kann
  # - die Gegenstelle müsste sich ohnehin neu anmelden.
  - platform: template
    name: "Netz Passwort speichern"
    id: ap_pass_save
    icon: mdi:wifi-lock
    entity_category: config
    on_press:
      - lambda: |-
          const std::string neu = id(ap_pass_input).state;
          // WPA2 kennt nichts zwischen "offen" und acht Zeichen. Ein zu
          // kurzer Versuch wird deshalb abgewiesen und nicht etwa
          // stillschweigend aufgefüllt oder verworfen - sonst stünde der
          // Nutzer vor einem Netz, das anders heißt, als er dachte.
          if (!neu.empty() && neu.length() < 8) {
            ESP_LOGW("netz", "Passwort nicht gespeichert: WPA2 braucht mindestens 8 Zeichen.");
            return;
          }
          strncpy(id(ap_passwort), neu.c_str(), sizeof(id(ap_passwort)) - 1);
          id(ap_passwort)[sizeof(id(ap_passwort)) - 1] = '\0';
          ESP_LOGI("netz", "Netz-Passwort %s. Neustart.",
                   neu.empty() ? "geloescht - Netz ist wieder offen" : "gespeichert");
      # Fünf Sekunden: Die Geräteseite wartet auf die Bestätigung über den
      # Ereignisstrom und zeigt erst danach ihre Schlussmeldung. Startet das
      # Gerät zu früh neu, erfährt der Nutzer nie, ob es geklappt hat.
      #
      # Die Zeit reicht zugleich, damit die Änderung im Flash landet: Ein
      # wiederhergestelltes Global schreibt beim nächsten Durchlauf, und
      # safe_reboot sichert vorher ohnehin ab.
      - delay: 5s
      - lambda: 'App.safe_reboot();'

  # Übernimmt die drei Felder darüber. Neustart danach, weil eine bestehende
  # Verbindung ihre Zugangsdaten nicht wechseln kann.
  - platform: template
    name: "MQTT speichern"
    id: mqtt_save
    icon: mdi:content-save-cog
    entity_category: config
    on_press:
      - lambda: |-
          /* Der Broker ist der Schalter: leer heisst aus. Weil das Feld beim
           * Start wieder gefuellt wird, ist ein leeres Feld hier auch wirklich
           * als "abschalten" gemeint - und nicht bloss nie ausgefuellt worden.
           *
           * Das Passwortfeld dagegen startet immer leer, im Klartext
           * zurueckzugeben waere es nicht wert. Leer heisst deshalb: das
           * gespeicherte behalten. Nur bei einem ANDEREN Broker faengt alles
           * von vorn an - dann gehoert ein leeres Feld als "kein Passwort"
           * verstanden, sonst kaeme man von einem Broker mit Anmeldung nie zu
           * einem ohne. */
          auto uebernimm = [](char *ziel, size_t platz, const std::string &quelle) {
            strncpy(ziel, quelle.c_str(), platz - 1);
            ziel[platz - 1] = '\0';
          };
          const std::string neuer_broker = id(mqtt_broker_input).state;
          const bool wechsel = neuer_broker != std::string(id(mqtt_broker));
          uebernimm(id(mqtt_broker), sizeof(id(mqtt_broker)), neuer_broker);
          uebernimm(id(mqtt_user), sizeof(id(mqtt_user)), id(mqtt_user_input).state);
          if (wechsel || !id(mqtt_pass_input).state.empty())
            uebernimm(id(mqtt_pass), sizeof(id(mqtt_pass)), id(mqtt_pass_input).state);
          ESP_LOGI("mqtt", "%s. Neustart.",
                   strlen(id(mqtt_broker)) == 0 ? "Broker geloescht - MQTT aus" : "Broker gespeichert");
      # Fünf Sekunden wie bei den anderen Speicherknöpfen: Die Geräteseite
      # wartet auf die Bestätigung über den Ereignisstrom und zeigt erst
      # danach ihre Schlussmeldung.
      - delay: 5s
      - lambda: 'App.safe_reboot();'

  - platform: template
    name: "Neigung kalibrieren"
    id: calibrate_level
    icon: mdi:crosshairs-gps
    on_press:
      then:
        - lambda: |-
            /* Den Nullpunkt aus dem GEGLAETTETEN Wert setzen, nicht aus
             * einem einzelnen Messwert.
             *
             * Vorher stand hier eine Momentaufnahme der Beschleunigung. Ein
             * Einzelwert rauscht um zwei bis drei Zehntelgrad - ueber 3500 mm
             * Radstand sind das ein bis zwei Zentimeter. Bei 5 cm Toleranz
             * faellt das nicht auf; im Praezisionsmodus mit 0,4 Grad stand
             * danach "Heck 3 cm hoch", obwohl frisch kalibriert und die
             * Wasserwaage eben zeigte. Genau so gemeldet worden.
             *
             * Der geglaettete Wert mittelt dagegen ueber Sekunden - bei
             * Anzeigeruhe 5 rund sechs davon - und ist damit um etwa den
             * Faktor zehn ruhiger als eine Momentaufnahme.
             *
             * Die Rechnung: angezeigt wird (roh - offset) * vorzeichen. Damit
             * das null wird, muss offset um den angezeigten Wert wandern -
             * mal Vorzeichen, weil der weiter unten angewandt wird. Das ist
             * zugleich selbstkorrigierend: Zweimal druecken bringt es naeher
             * an null, nicht weiter weg.
             */
            if (isnan(id(pitch).state) || isnan(id(roll).state)) {
              ESP_LOGW("level", "Kalibrierung abgebrochen: noch keine gueltigen Messwerte.");
              return;
            }
            id(pitch_offset) += id(pitch).state * ${pitch_sign};
            id(roll_offset)  += id(roll).state * ${roll_sign};

            // Die Glaettung sofort mitziehen, sonst laeuft die Anzeige dem
            // neuen Nullpunkt noch Sekunden hinterher und sieht aus, als
            // haette der Knopf nicht gewirkt.
            id(pitch_smooth) = 0.0f;
            id(roll_smooth)  = 0.0f;

            // Auch die Ruhelage der Diebstahlwarnung neu setzen - sonst meldet
            // sie eine Lageaenderung, die nur aus dem verschobenen Nullpunkt
            // stammt.
            id(ruhe_pitch) = 0.0f;
            id(ruhe_roll)  = 0.0f;
            id(ruhe_takte) = 0;

            ESP_LOGI("level", "Kalibrierung gespeichert: pitch_offset=%.3f, roll_offset=%.3f",
                     id(pitch_offset), id(roll_offset));

# --- OLED: Libelle (Blase) links + exakte Zahlen rechts --------------------
display:
  - platform: ssd1306_i2c
    model: "SSD1306 72x40"
    i2c_id: grove
    address: 0x3C
    # 1s statt 200ms: Hier steht kein wandernder Messwert mehr, sondern ein
    # Zustand. Der ändert sich selten, und der I2C-Bus teilt sich die Leitung
    # mit dem Beschleunigungssensor.
    update_interval: 1s
    lambda: |-
      // Das Feld zeigt den SYSTEMZUSTAND, nicht die Neigung.
      //
      // Die Nivellieranzeige gehört aufs Handy: Sie braucht Größe, Farbe und
      // einen Blickwinkel, den ein 72 x 40 grosses Feld an der Einbaustelle
      // nicht hergibt - wer Keile unterlegt, steht draußen und sieht es nicht.
      //
      // Was hier steht, beantwortet dafür genau die Fragen, die sich OHNE
      // Handy nicht beantworten lassen: Läuft das Gerät? Und unter welcher
      // Adresse ist es zu erreichen? Letzteres ist die häufigste Rückfrage
      // überhaupt, und die Antwort stand bisher nirgends.

      // Kein Messwert heißt: Der Sensor antwortet nicht. Das ist die einzige
      // Störung, die der Nutzer selbst beheben kann, deshalb steht sie vorn.
      if (isnan(id(pitch).state)) {
        it.print(0,  0, id(font_zeile), "Sensor?");
        it.print(0, 14, id(font_klein), "MPU6050 stumm");
        it.print(0, 26, id(font_klein), "Verkabelung");
        return;
      }

      const std::string ip   = id(ip_adresse).state;
      const std::string netz = id(wlan_name).state;

      // Solange keine gültige Adresse aus dem Heimnetz vorliegt, spannt das
      // Gerät sein eigenes Netz auf - dann gilt die feste Adresse aus der
      // manual_ip-Angabe der Gerätedatei.
      const bool im_fremden_netz = !ip.empty() && ip != "0.0.0.0";

      if (im_fremden_netz) {
        it.printf(0,  0, id(font_klein), "WLAN %.9s", netz.c_str());
        it.print (0, 12, id(font_zeile), ip.c_str());
      } else {
        // Kein Passwort auf dem Display: Ab Werk gibt es keins, und ein selbst
        // vergebenes gehört dem Nutzer - das steht nicht sichtbar im
        // Fahrzeug herum.
        it.print (0,  0, id(font_klein), "Netz CamperMinder");
        it.print (0, 12, id(font_zeile), "192.168.4.1");
      }

      // Fußzeile: eigene Version, dazu ein Kürzel, wenn eine Zentrale mithört.
      it.printf(0, 28, id(font_klein), "v${firmware_version}%s",
                id(zentrale_verbunden).state ? "  HA" : "");