<!--
  CamperMaid - Bildmarke.

  Grundsatz: einfarbig, vier Formen, keine Verlaeufe, keine Schatten.
  Verlaeufe und weiche Schatten sind das, was ein Zeichen beliebig aussehen
  laesst; ausserdem ueberleben sie das Verkleinern auf 48 Pixel nicht.

  EINFARBIG ist hier kein Geschmack, sondern Notwendigkeit: Das Icon liegt mit
  Transparenz vor und erscheint in HACS je nach Design auf hellem wie auf
  dunklem Grund. Ein heller Fahrzeugkoerper waere auf Weiss unsichtbar. Das
  Tuerkis traegt auf beidem.

  Die Radnaben sind Aussparungen, keine zweite Farbe - dadurch bleibt das
  Zeichen bei jedem Hintergrund vollstaendig.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <path fill="#2fb6c9" fill-rule="evenodd" d="
    M8 64 L8 46 Q8 43 11 42 L30 30 Q32 29 35 29 L88 29 Q92 29 92 33 L92 62
    Q92 65 89 65 L84.5 65 A10.5 10.5 0 0 0 63.5 65 L40.5 65
    A10.5 10.5 0 0 0 19.5 65 L11 65 Q8 65 8 64 Z

    M30 56.5 A10.5 10.5 0 1 1 30 77.5 A10.5 10.5 0 1 1 30 56.5 Z
    M30 63 A4 4 0 1 0 30 71 A4 4 0 1 0 30 63 Z

    M74 56.5 A10.5 10.5 0 1 1 74 77.5 A10.5 10.5 0 1 1 74 56.5 Z
