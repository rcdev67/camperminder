<!--
  Wortmarke fuer HELLE Hintergraende. Siehe campermaid-wordmark-dark.svg fuer
  die Begruendung der zwei Fassungen und den Hinweis zur Schriftart.

  Unterschied ist ausschliesslich die Farbe von "CAMPER" und der Zeile
  darunter. Bildmarke und "MAID" bleiben tuerkis - dadurch sieht die Marke auf
  beiden Untergruenden gleich aus und nicht wie zwei verschiedene Logos.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 64" width="100%" height="100%">
  <g transform="translate(0 2) scale(0.6)">
    <path fill="#2fb6c9" fill-rule="evenodd" d="
      M8 64 L8 46 Q8 43 11 42 L30 30 Q32 29 35 29 L88 29 Q92 29 92 33 L92 62
      Q92 65 89 65 L84.5 65 A10.5 10.5 0 0 0 63.5 65 L40.5 65
      A10.5 10.5 0 0 0 19.5 65 L11 65 Q8 65 8 64 Z
      M30 56.5 A10.5 10.5 0 1 1 30 77.5 A10.5 10.5 0 1 1 30 56.5 Z
      M30 63 A4 4 0 1 0 30 71 A4 4 0 1 0 30 63 Z
      M74 56.5 A10.5 10.5 0 1 1 74 77.5 A10.5 10.5 0 1 1 74 56.5 Z
      M74 63 A4 4 0 1 0 74 71 A4 4 0 1 0 74 63 Z"/>
  </g>

  <text x="72" y="36" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', Arial"
        font-weight="600" font-size="30" letter-spacing="1" fill="#1b2430">CAMPER<tspan fill="#2fb6c9">MAID</tspan></text>
  <text x="73" y="52" font-family="Bahnschrift, 'DIN Alternate', 'Segoe UI', Arial"
